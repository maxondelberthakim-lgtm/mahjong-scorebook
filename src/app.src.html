<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahjong Scorebook</title>
<meta name="description" content="Keep mahjong scores for Hong Kong, Singapore, Riichi, Taiwanese and Chinese Official rules. Photograph the winning hand and it reads the tiles.">
<meta name="theme-color" content="#1D5C47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scorebook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&display=swap&text=__KAI_TEXT__">
<script>window.API_URL = '__API_URL__'; window.BUILD = '__BUILD__'; window.LITE = __LITE__; window.BRAND = '__BRAND__';</script>
<style>
:root{
  --ground:#F2F2F7;--paper:#FFFFFF;--paper-2:#F7F7FA;--fill:rgba(120,120,128,.12);--fill-2:rgba(120,120,128,.2);
  --ink:#000000;--ink-2:#48484A;--muted:#8A8A8E;
  --line:rgba(60,60,67,.24);--line-2:rgba(60,60,67,.32);
  --accent:#1F7A5A;--accent-ink:#FFFFFF;--accent-soft:rgba(31,122,90,.12);
  --felt:#1F5A45;--felt-deep:#153F31;--felt-ink:#ECF5F0;--felt-muted:#A7C6B7;--plate:rgba(6,26,19,.34);
  --felt-gain:#A4E6C2;--felt-loss:#FFB6A9;
  --gain:#1E8E4C;--loss:#D70015;--gold:#E9A800;--ios-green:#34C759;
  --bone:#F6F0DF;--bone-hi:#FFFDF6;--bone-edge:#DCD2B8;--tile-back:#2D7A5B;
  --scrim:rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --f-num:var(--f-ui);
  --f-display:var(--f-ui);
  --f-cjk:"LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi","BiauKai","Noto Serif CJK TC","PingFang TC",serif;
  --f-cjk-ui:"PingFang TC","PingFang SC","Hiragino Sans","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#000000;--paper:#1C1C1E;--paper-2:#2C2C2E;--fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);
  --ink:#FFFFFF;--ink-2:#AEAEB2;--muted:#8E8E93;
  --line:rgba(84,84,88,.6);--line-2:rgba(84,84,88,.8);
  --accent:#5AD79F;--accent-ink:#04211A;--accent-soft:rgba(90,215,159,.16);
  --felt:#15402F;--felt-deep:#0B2A1F;--felt-ink:#E6F2EC;--felt-muted:#8DB6A3;--plate:rgba(0,0,0,.30);
  --felt-gain:#8FE0B5;--felt-loss:#FFA497;
  --gain:#30D158;--loss:#FF453A;--gold:#FFD60A;--ios-green:#30D158;
  --bone:#E8E1CD;--bone-hi:#F3EDDC;--bone-edge:#B9AE90;--tile-back:#2A6B51;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#000000;--paper:#1C1C1E;--paper-2:#2C2C2E;--fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);
  --ink:#FFFFFF;--ink-2:#AEAEB2;--muted:#8E8E93;
  --line:rgba(84,84,88,.6);--line-2:rgba(84,84,88,.8);
  --accent:#5AD79F;--accent-ink:#04211A;--accent-soft:rgba(90,215,159,.16);
  --felt:#15402F;--felt-deep:#0B2A1F;--felt-ink:#E6F2EC;--felt-muted:#8DB6A3;--plate:rgba(0,0,0,.30);
  --felt-gain:#8FE0B5;--felt-loss:#FFA497;
  --gain:#30D158;--loss:#FF453A;--gold:#FFD60A;--ios-green:#30D158;
  --bone:#E8E1CD;--bone-hi:#F3EDDC;--bone-edge:#B9AE90;--tile-back:#2A6B51;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.k{font-family:var(--f-cjk-ui);font-weight:600}
.muted{color:var(--muted)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:8px 140px}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:13px;font-weight:400;letter-spacing:-.005em;text-transform:uppercase;color:var(--muted)}
.boot{min-height:60vh;display:grid;place-items:center;color:var(--muted);padding-inline:16px;text-align:center}

/* buttons, chips, controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:10px 18px;border-radius:12px;border:0;background:var(--fill);color:var(--accent);font-weight:600;font-size:17px;text-decoration:none;line-height:1.2;letter-spacing:-.01em;transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.98);opacity:.85}
.btn svg{width:19px;height:19px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:52px;font-size:17px;padding-inline:22px;border-radius:14px}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:5px 14px;font-size:15px;border-radius:10px}
.btn.danger{color:var(--loss)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--accent)}
.iconbtn svg{width:22px;height:22px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500;text-decoration:none;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 14px;border-radius:999px;border:0;background:var(--fill);color:var(--ink);font-weight:500;font-size:16px;max-width:100%;transition:background .12s ease,color .12s ease}
.chip .cw{font-family:var(--f-cjk-ui);font-weight:600;color:var(--muted);font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chip[aria-pressed="true"] .cw{color:var(--accent-ink);opacity:.8}
.chip:disabled{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--fill);border:0;border-radius:9px;padding:2px;gap:2px}
.seg button{min-height:32px;border:0;border-radius:7px;background:transparent;font-weight:500;font-size:14px;padding:4px 6px;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button .cw{font-family:var(--f-cjk-ui);font-weight:600;margin-left:5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.seg button[aria-pressed="true"] .cw{color:var(--accent)}
.field{display:grid;gap:6px}
.field>label,.flabel{font-weight:400;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:-.005em;padding-left:4px}
.input,.select{width:100%;min-height:44px;padding:10px 14px;border-radius:10px;border:0;background:var(--fill);color:var(--ink);font-size:17px}
.input::placeholder{color:var(--muted)}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.input:focus,.select:focus{outline:2px solid var(--accent);outline-offset:0}
.stepper{display:inline-flex;align-items:center;border:0;border-radius:8px;background:var(--fill);overflow:hidden}
.stepper button{width:36px;height:32px;border:0;background:transparent;font-size:19px;line-height:1;color:var(--ink);font-weight:500}
.stepper button:first-child{border-right:1px solid var(--line)}
.stepper button:last-child{border-left:1px solid var(--line)}
.stepper button:disabled{opacity:.3}
.stepper .sv{min-width:40px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.switch{position:relative;width:51px;height:31px;border-radius:99px;border:0;background:var(--fill-2);flex:none;padding:0;transition:background .2s ease}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s ease}
.switch[aria-checked="true"]{background:var(--ios-green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.toggle-row .tl{display:grid;gap:1px}
.toggle-row .tl b{font-weight:400}
.toggle-row .tl small{color:var(--muted);font-size:13px}

/* top bar and dock */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
@supports not (color:color-mix(in srgb,red,blue)){.topbar{background:var(--ground)}}
.topbar-in{max-width:680px;margin:0 auto;padding:4px 8px;display:flex;align-items:center;gap:4px;min-height:52px}
.topbar .ttl{flex:1;min-width:0;text-align:center;display:grid;line-height:1.2}
.topbar .ttl b{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.topbar .ttl span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{display:inline-flex;align-items:center;gap:0;border:0;background:none;min-height:44px;padding:0 8px 0 2px;font-weight:400;color:var(--accent);font-size:17px;letter-spacing:-.01em}
.backbtn svg{width:22px;height:22px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--ground) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
@supports not (color:color-mix(in srgb,red,blue)){.dock{background:var(--ground)}}
.dock-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:10px}
.progress{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .35s ease}
.steps{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.steps b{color:var(--ink);font-weight:600}

/* home */
.hero{padding-block:22px 18px;display:grid;gap:12px;justify-items:start}
.brand{display:flex;align-items:center;gap:14px}
.seal{display:grid;place-items:center;width:50px;height:50px;border-radius:12px;background:linear-gradient(160deg,#D24A3A,#B73224);color:#FFF3E8;font-family:var(--f-cjk);font-weight:700;font-size:17px;line-height:1.02;writing-mode:vertical-rl;box-shadow:inset 0 0 0 1.5px rgba(255,243,232,.5),0 4px 12px rgba(183,50,36,.28)}
.hero h1{font-size:34px;line-height:1.1;letter-spacing:-.02em}
.hero .lede{color:var(--ink-2);max-width:46ch;font-size:17px}
.rules-strip{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.rules-strip span b{font-family:var(--f-cjk-ui);font-weight:600;color:var(--ink-2);margin-left:4px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.section-head h2{font-size:22px;letter-spacing:-.02em}
.gcard{display:grid;gap:10px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:0;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);transition:transform .12s ease}
.gcard:active{transform:scale(.99)}
.gcard .gtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gcard .gname{font-weight:600;font-size:17px}
.gcard .gmeta{font-size:13px;color:var(--muted)}
.gscores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gscores div{display:grid;gap:1px;min-width:0}
.gscores span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gscores b{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.store-note{margin-top:28px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot-ok{background:var(--gain)}.dot-warn{background:var(--gold)}.dot-bad{background:var(--loss)}
.example-note{font-size:13px;color:var(--muted)}
.list{background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.list .cell{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 16px;font-size:17px;color:var(--ink);border:0;background:none;width:100%;text-align:left;position:relative}
.list .cell+.cell::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid var(--line)}
.list .cell .ct{flex:1;min-width:0;display:grid;gap:1px}
.list .cell small{font-size:13px;color:var(--muted)}
.list .cell .chev{color:var(--muted);flex:none;width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg);margin-right:4px}
.list .cell svg{width:22px;height:22px;color:var(--accent);flex:none}

/* the table */
.table{border-radius:22px;padding:8px;background:var(--felt-deep);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 10px 30px rgba(10,30,22,.16)}
.felt{position:relative;border-radius:16px;padding:12px;color:var(--felt-ink);
  background:var(--felt);
  background:radial-gradient(120% 90% at 50% 42%,color-mix(in srgb,var(--felt) 86%,#ffffff) 0%,var(--felt) 58%,var(--felt-deep) 100%);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,.72fr) minmax(0,1fr);grid-template-rows:auto minmax(96px,1fr) auto;gap:8px;min-height:300px}
.felt::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 40px rgba(0,0,0,.18)}
.seat{min-width:0;display:flex}
.seat.top{grid-column:1/4;grid-row:1;justify-content:center}
.seat.bottom{grid-column:1/4;grid-row:3;justify-content:center}
.seat.left{grid-column:1;grid-row:2;align-items:center}
.seat.right{grid-column:3;grid-row:2;align-items:center;justify-content:flex-end}
.plate{position:relative;width:100%;max-width:176px;min-width:0;padding:8px 10px 9px;border-radius:12px;background:var(--plate);border:1px solid rgba(255,255,255,.1);display:grid;gap:3px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.plate .ph{display:flex;align-items:center;gap:7px;min-width:0}
.plate .pn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--felt-ink);min-width:0}
.plate .ps{font-variant-numeric:tabular-nums;font-weight:600;font-size:21px;line-height:1.1;white-space:nowrap;letter-spacing:-.01em}
.table.is-riichi .plate .ps{font-size:17px}
.plate .pm{font-variant-numeric:tabular-nums;font-size:12px;color:var(--felt-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .ps.pos{color:var(--felt-gain)}.plate .ps.neg{color:var(--felt-loss)}
.plate.is-dealer{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.dealer-mark{position:absolute;top:-9px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2A1C05;display:grid;place-items:center;font-family:var(--f-cjk);font-weight:700;font-size:14px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.center{grid-column:2;grid-row:2;display:grid;place-items:center;align-content:center;text-align:center;gap:4px}
.center .rw{font-family:var(--f-cjk);font-weight:700;font-size:46px;line-height:1;color:var(--felt-ink);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.center .rl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--felt-muted)}
.sticks{display:flex;gap:10px;justify-content:center;font-variant-numeric:tabular-nums;font-size:12px;color:var(--felt-ink)}
.stick{display:inline-flex;align-items:center;gap:4px}
.stick i{display:inline-block;width:18px;height:5px;border-radius:3px;background:#F4EFE2;position:relative}
.stick i::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;background:#C43B2C;transform:translate(-50%,-50%)}
.stick.honba i::after{background:#222;box-shadow:-5px 0 0 #222,5px 0 0 #222}
.table.compact .felt{min-height:0;padding:10px;gap:6px}
.table.compact .plate .ps{font-size:16px}
.table.compact .center .rw{font-size:34px}

/* banners */
.banner{margin:14px 0;padding:14px 16px;border-radius:14px;background:var(--paper);border:0;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{font-size:15px;color:var(--ink-2);flex:1 1 220px}
.banner p b{color:var(--ink);font-weight:600}
.banner.gold{background:color-mix(in srgb,var(--gold) 14%,var(--paper))}
.banner.keep{background:var(--accent-soft)}
.banner .row{gap:6px}

/* ledger */
.ledger{margin-top:22px}
.ledger h2{font-size:20px;letter-spacing:-.02em}
.lhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.lrows{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.lrow{position:relative}
.lrow+.lrow::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid var(--line)}
.lsum{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;width:100%;padding:12px 16px;background:none;border:0;text-align:left;color:var(--ink);align-items:start}
.lno{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);padding-top:3px;min-width:26px}
.lmain{display:grid;gap:3px;min-width:0}
.lwho{font-weight:600;font-size:16px}
.lwho em{font-style:normal;font-weight:400;color:var(--muted)}
.lpats{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lval{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--accent);text-align:right;white-space:nowrap;padding-top:3px}
.ldeltas{grid-column:2/4;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-variant-numeric:tabular-nums;font-size:12.5px}
.ldeltas span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldeltas small{color:var(--muted);margin-right:3px}
.pos{color:var(--gain)}.neg{color:var(--loss)}.zero{color:var(--muted)}
.ldetail{padding:0 16px 14px 54px;display:grid;gap:10px}
.ltiles{display:flex;flex-wrap:wrap;gap:3px 3px;align-items:flex-end}
.ltiles .gap{width:8px}
.empty{padding:22px 16px;color:var(--muted);font-size:15px}

/* tiles */

<script>
(function () {
  'use strict';
  var root = document.getElementById('app');
  if (!window.preact || !window.preactHooks || !window.htm || !window.MJ) {
    root.innerHTML = '<div class="boot">The scorebook could not load its interface. Check your connection and open it again.</div>';
    return;
  }
  const { h, render } = preact;
  const { useState, useEffect, useMemo, useRef } = preactHooks;
  const html = htm.bind(h);
  const RULES = MJ.RULES;
  const LITE = !!window.LITE;
  const BRAND = window.BRAND || 'Mahjong Scorebook';
  const IS_DEFAULT_BRAND = BRAND === 'Mahjong Scorebook';

  /* ------------------------------------------------ helpers */
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const nf = (() => { try { return new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 }); } catch (e) { return { format: String }; } })();
  const fmt = (n) => nf.format(Math.round((+n || 0) * 100) / 100);
  const signed = (n) => (n > 0.004 ? '+' : n < -0.004 ? '−' : '') + fmt(Math.abs(n));
  const cls = (n) => (n > 0.004 ? 'pos' : n < -0.004 ? 'neg' : 'zero');
  const pname = (g, p) => ((g.players[p] && g.players[p].name) || 'Player ' + (p + 1));
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const WZ = MJ.WINDS_ZH;
  function moneyFor(g, pts) {
    const m = g.money || {};
    if (!+m.per) return '';
    const v = g.ruleset === 'riichi' ? (pts / 1000) * m.per : pts * m.per;
    return (v > 0.004 ? '+' : v < -0.004 ? '−' : '') + (m.symbol ? m.symbol + ' ' : '') + fmt(Math.abs(v));
  }
  function ago(ts) {
    const s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    try { return new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; }
  }
  function howWords(R) {
    return ({
      hk: ['自摸', '出銃'], sg: ['自摸', '放炮'], tw: ['自摸', '放槍'], riichi: ['ツモ', 'ロン'], mcr: ['自摸', '点和'], custom: ['', ''],
    })[R.id];
  }
  function patLabel(R, p, selfDraw) {
    if (p.id === 'lastTile') {
      const zh = selfDraw ? { hk: '海底撈月', tw: '海底撈月', sg: '海底捞月' } : { hk: '河底撈魚', tw: '河底撈魚', sg: '河底捞鱼' };
      return { zh: zh[R.id] || p.zh, en: selfDraw ? 'Self-drawn last tile' : 'Won on the last discard' };
    }
    return { zh: p.zh, en: p.en };
  }
  function groupsOf(R) {
    const seen = [];
    for (const p of R.patterns) if (!seen.includes(p.g)) seen.push(p.g);
    if (R.id === 'mcr') seen.sort((a, b) => +b.slice(1) - +a.slice(1));
    return seen;
  }
  const groupName = (g) => MJ.GROUPS[g] || (g[0] === 'f' ? g.slice(1) + ' fan' : g);
  function valueText(R, p, V, menzen) {
    if (R.id === 'riichi') {
      if (p.yakuman) return 'Yakuman';
      const hv = menzen ? p.v : p.open;
      return hv == null ? 'closed only' : hv + ' han';
    }
    const v = V[p.id];
    if (v === 'L') return 'Limit';
    return v + ' ' + R.unit;
  }

  /* ------------------------------------------------ api */

  function storeLine() {

  /* ------------------------------------------------ names & recap image */
  const isGuest = (u) => !!(u && (u.guest || /^guest-/.test(u.name || '')));
  const displayName = (u) => (u ? (isGuest(u) ? 'Guest ' + u.name.replace(/^guest-/, '') : u.name) : '');
  // Draws the whole match (standings, settlement, every hand) onto a canvas and returns a PNG blob.
  async function recapImage(game) {
    const R = RULES[game.ruleset], rows = MJ.standings(game), riichi = game.ruleset === 'riichi';
    const hands = game.entries;
    const W = 1080, pad = 48, lh = 40, lh2 = 66;
    const H = 420 + rows.length * 52 + 40 + Math.max(1, hands.length) * (lh2 + 6) + 160;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;

    let y = 210;

      const m = riichi ? moneyFor(game, (r.final || 0) * 1000) : moneyFor(game, r.points);

      x.fillText(main + (m ? '   ' + m : ''), W - pad, y); x.textAlign = 'left';
    });
    const hasMoney = +(game.money && game.money.per) > 0;
    const nets = hasMoney ? MJ.moneyNets(game) : (riichi ? rows.reduce((a, r) => { a[r.p] = (r.final || 0) * 1000; return a; }, [0, 0, 0, 0]) : MJ.totals(game));
    const transfers = MJ.settle(nets);
    if (transfers.length) {
      y += 60; x.fillStyle = '#17231E'; x.font = '700 30px system-ui, sans-serif'; x.fillText('Settle up', pad, y);
      x.font = '400 26px system-ui, sans-serif';
      transfers.forEach((t) => { y += 38; x.fillStyle = '#3A4942'; x.fillText(pname(game, t.from) + ' pays ' + pname(game, t.to) + '  ' + (hasMoney ? moneyText(game, t.amount) : riichi ? fmt(t.amount / 1000) : fmt(t.amount) + ' pts'), pad, y); });
    }
    y += 70; x.fillStyle = '#17231E'; x.font = '700 30px system-ui, sans-serif'; x.fillText('Every hand', pad, y); y += 14;
    x.font = '400 22px system-ui, sans-serif';
    const cols = [pad, pad + 60, pad + 200, pad + 520];
    const dcols = [W - pad - 480, W - pad - 320, W - pad - 160, W - pad];
    y += 34; x.fillStyle = '#5E6E67'; x.fillText('#', cols[0], y); x.fillText('Round', cols[1], y); x.fillText('Result', cols[2], y);
    x.textAlign = 'right'; game.players.forEach((p, i) => x.fillText(pname(game, i).slice(0, 10), dcols[i], y)); x.textAlign = 'left';
    let n = 0;
    for (const e of hands) {
      y += lh; x.fillStyle = '#17231E'; x.font = '400 22px system-ui, sans-serif';
      let sub = '';
      if (e.kind === 'side') { x.fillText('·', cols[0], y); x.fillText('Payout', cols[1], y); x.fillText(e.label.slice(0, 40), cols[2], y); }
      else {
        n++; x.fillText(String(n), cols[0], y); x.fillText(MJ.roundLabel(game, e.before).replace(' · ', ' '), cols[1], y);
        const who = e.outcome === 'draw' ? 'Draw' : pname(game, e.winner) + (e.how === 'self' ? ' self-drew' : ' won off ' + pname(game, e.discarder));
        x.fillText(who.slice(0, 34), cols[2], y);
        if (e.outcome === 'win') sub = e.text.split(' · ')[0] + (e.patterns.length ? ' · ' + e.patterns.join(' · ') : '');
      }
      x.textAlign = 'right';
      e.deltas.forEach((d, i) => { x.fillStyle = d > 0.004 ? '#15784A' : d < -0.004 ? '#BE3A2C' : '#8EA197'; x.fillText(signed(d), dcols[i], y); });
      x.textAlign = 'left';
      if (sub) { y += 26; x.fillStyle = '#5E6E67'; x.font = '400 20px system-ui, sans-serif'; x.fillText(sub.slice(0, 80), cols[1], y); }
      x.strokeStyle = '#D5DDD7'; x.beginPath(); x.moveTo(pad, y + 12); x.lineTo(W - pad, y + 12); x.stroke();
    }
    if (!hands.length) { y += lh; x.fillStyle = '#5E6E67'; x.fillText('No hands recorded.', pad, y); }
    y += 70; x.fillStyle = '#8EA197'; x.font = '400 20px system-ui, sans-serif';
    x.fillText('Recap made with ' + BRAND + ' · ' + new Date().toLocaleString(), pad, y);
    return new Promise((res) => cv.toBlob(res, 'image/png'));
  }
  async function saveRecap(game, onToast) {
    const blob = await recapImage(game);
    const name = 'mahjong-recap-' + new Date(game.createdAt).toISOString().slice(0, 10) + '.png';
    try {
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    onToast('Recap image saved');
  }

  /* ------------------------------------------------ files: download, share, import */
  function downloadText(name, text, type) {
    const blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  function canShareFiles() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.txt', { type: 'text/plain' })] })); } catch (e) { return false; }
  }
  async function shareText(name, text, type) {
    const file = new File([text], name, { type: type || 'text/plain' });
    await navigator.share({ files: [file], title: name });
  }
  function importGamesFromFile(file, done) {
    const rd = new FileReader();
    rd.onerror = () => done(-1);
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result);
        const list = Array.isArray(j) ? j : j && Array.isArray(j.games) ? j.games.map((x) => (x && x.game) || x) : [j];
        let n = 0;
        for (const g of list) {
          if (!g || !g.id || !RULES[g.ruleset] || !Array.isArray(g.entries) || !Array.isArray(g.players)) continue;
          const cur = Store.get(g.id);
          if (cur && (cur.updatedAt || 0) >= (g.updatedAt || 0)) continue;
          delete g.example;
          Store.save(clone(g)); n++;
        }
        done(n);
      } catch (e) { done(-1); }
    };
    rd.readAsText(file);
  }

  /* ------------------------------------------------ example game */
  function exampleGame() {
    const g = MJ.newGame({ ruleset: 'hk', players: [{ name: 'Ah Mei' }, { name: 'Budi' }, { name: 'Chris' }, { name: 'Dewi' }], money: { per: 1000, symbol: 'Rp' } });
    g.example = true; g.name = 'Example game';
    const T = (s, win, melds, bonus) => ({ hand: MJ.parse(s), melds: melds || [], win, bonus: bonus || [] });
    const hands = [
      { outcome: 'win', winner: 1, how: 'discard', discarder: 3, tiles: T('123456m77z', '7z', [{ type: 'pon', tile: '5z' }, { type: 'pon', tile: '6z' }], ['F2']) },
      { outcome: 'win', winner: 2, how: 'self', tiles: T('123456777p555z11z', '1z') },
      { outcome: 'draw' },
      { outcome: 'win', winner: 0, how: 'discard', discarder: 1, tiles: T('123456789m234m55m', '5m') },
      { outcome: 'win', winner: 3, how: 'discard', discarder: 2, tiles: T('222m444p888s99p', '9p', [{ type: 'pon', tile: '7z' }]) },
    ];
    let t = Date.now() - 45 * 60 * 1000;
    hands.forEach((i) => { const e = MJ.recordHand(g, i); t += 8 * 60 * 1000; e.at = t; });
    g.createdAt = Date.now() - 50 * 60 * 1000;
    return g;
  }

  /* ------------------------------------------------ small components */
  function Seg({ options, value, onChange, label }) {
    return html`<div class="seg" role="group" aria-label=${label}>${options.map(([v, text, cw]) => html`<button type="button" aria-pressed=${value === v ? 'true' : 'false'} onClick=${() => onChange(v)}>${text}${cw ? html`<span class="cw">${cw}</span>` : null}</button>`)}</div>`;
  }
  function Switch({ on, onChange, label }) {
    return html`<button type="button" class="switch" role="switch" aria-checked=${on ? 'true' : 'false'} aria-label=${label} onClick=${() => onChange(!on)}></button>`;
  }
  function Stepper({ value, min, max, onChange, label, step }) {
    const st = step || 1;
    return html`<span class="stepper" role="group" aria-label=${label}>
      <button type="button" aria-label=${'Less ' + label} disabled=${value <= min} onClick=${() => onChange(Math.max(min, value - st))}>−</button>
      <span class="sv" aria-live="polite">${value}</span>
      <button type="button" aria-label=${'More ' + label} disabled=${value >= max} onClick=${() => onChange(Math.min(max, value + st))}>+</button>
    </span>`;
  }
  function PlayerChips({ game, value, onPick, exclude, multi }) {
    return html`<div class="chips">${[0, 1, 2, 3].map((p) => {
      const on = multi ? (value || []).includes(p) : value === p;
      const seat = MJ.seatOf(game, p);
      return html`<button type="button" class="chip" aria-pressed=${on ? 'true' : 'false'} disabled=${exclude != null && exclude === p} onClick=${() => onPick(p)}><span class="cw">${WZ[seat]}</span>${pname(game, p)}</button>`;
    })}</div>`;
  }
  function Sheet({ title, sub, onClose, children, foot, tall }) {
    const ref = useRef(null);
    useEffect(() => {
      const onKey = (e) => { if (e.key === 'Escape') onClose(); };
      document.addEventListener('keydown', onKey);
      const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
      if (ref.current) ref.current.focus();
      return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
    }, []);
    return html`<div class="scrim" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div class=${'sheet' + (tall ? ' tall' : '')} role="dialog" aria-modal="true" aria-label=${title} tabindex="-1" ref=${ref}>
        <div class="sheet-head"><div class="st"><b>${title}</b>${sub ? html`<span>${sub}</span>` : null}</div><button type="button" class="iconbtn" aria-label="Close" onClick=${onClose}>${I.close}</button></div>
        <div class="sheet-body">${children}</div>
        ${foot ? html`<div class="sheet-foot">${foot}</div>` : null}
      </div>
    </div>`;
  }

      <div class="sec"><p>${body}</p></div>
    <//>`;
  }

  /* ------------------------------------------------ table */
  function TableHero({ game, compact }) {
    const t = MJ.totals(game), st = game.state;
    const riichi = game.ruleset === 'riichi';
    const start = riichi ? +game.settings.startPoints || 0 : 0;
    const plate = (p) => {
      const seat = MJ.seatOf(game, p), dealer = st.dealer === p;
      const net = t[p] - start;
      const m = moneyFor(game, net);
      return html`<div class=${'plate' + (dealer ? ' is-dealer' : '')}>
        ${dealer ? html`<span class="dealer-mark" title="Dealer" aria-label="Dealer">莊</span>` : null}
        <span class="ph"><${Tile} code=${(seat + 1) + 'z'} size="xs" label=${MJ.WINDS[seat] + ' seat'} /><span class="pn">${pname(game, p)}</span></span>
        <span class=${'ps ' + (riichi ? '' : cls(net))}>${riichi ? fmt(t[p]) : signed(t[p])}</span>
        ${m ? html`<span class="pm">${m}</span>` : null}
      </div>`;
    };
    return html`<div class=${'table' + (compact ? ' compact' : '') + (riichi ? ' is-riichi' : '')}>
      <div class="felt">
        <div class="seat top">${plate(2)}</div>
        <div class="seat left">${plate(3)}</div>
        <div class="center">
          <span class="rw" aria-hidden="true">${WZ[st.round % 4]}</span>
          <span class="rl">${MJ.roundLabel(game)}</span>
          ${riichi ? html`<span class="sticks"><span class="stick honba" title="Honba"><i></i>${st.honba || 0}</span><span class="stick" title="Riichi sticks on the table"><i></i>${Math.round((st.pot || 0) / 1000)}</span></span>` : null}
        </div>
        <div class="seat right">${plate(1)}</div>
        <div class="seat bottom">${plate(0)}</div>
      </div>

  /* ------------------------------------------------ ledger */
  function entryWho(game, e) {
    if (e.kind === 'side') return html`${e.label}`;
    if (e.outcome === 'draw') return html`Draw${e.draw && e.draw.abortive ? ' (abortive)' : ''}`;
    const w = pname(game, e.winner);
    if (e.how === 'self') return html`${w} <em>self-drew</em>`;
    return html`${w} <em>won off</em> ${pname(game, e.discarder)}`;
  }
  function Ledger({ game }) {
    const [open, setOpen] = useState(null);
    const R = RULES[game.ruleset];
    const rows = game.entries.map((e, i) => ({ e, i })).reverse();

      <div class="lhead"><h2>Hands</h2><span class="muted" style=${{ fontSize: '13px' }}>${handNo ? handNo + ' played' : ''}</span></div>
      ${rows.length ? html`<div class="lrows">${rows.map(({ e, i }) => {
        const isOpen = open === e.id;
        return html`<div class="lrow" key=${e.id}>
          <button type="button" class="lsum" aria-expanded=${isOpen ? 'true' : 'false'} onClick=${() => setOpen(isOpen ? null : e.id)}>
            <span class="lno">${numbers[i] ? '#' + numbers[i] : '·'}</span>
            <span class="lmain">
              <span class="lwho">${entryWho(game, e)}</span>
              ${e.kind === 'hand' && e.outcome === 'win' ? html`<span class="lpats">${e.patterns.length ? e.patterns.join(' · ') : (e.label || '—')}</span>` : html`<span class="lpats">${e.kind === 'hand' ? MJ.roundLabel(game, e.before) : ''}</span>`}
            </span>
            <span class="lval">${e.kind === 'hand' && e.outcome === 'win' ? e.text.split(' · ')[0] : ''}</span>
            <span class="ldeltas">${e.deltas.map((d, p) => html`<span class=${cls(d)}><small>${pname(game, p).slice(0, 6)}</small>${signed(d)}</span>`)}</span>
          </button>
          ${isOpen ? html`<div class="ldetail">
            ${e.kind === 'hand' ? html`<p class="hint">${MJ.roundLabel(game, e.before)} · dealer ${pname(game, e.before.dealer)} · ${new Date(e.at).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</p>` : null}
            ${e.tiles ? html`<${HandView} tiles=${e.tiles} size="sm" />` : null}
            ${e.kind === 'hand' && e.outcome === 'win' ? html`<p style=${{ fontSize: '14px' }}><b>${e.text}</b>${e.liable != null ? ' · ' + pname(game, e.liable) + ' paid for everyone' : ''}</p>` : null}
          </div>` : null}
        </div>`;
      })}</div>` : html`<p class="empty">No hands yet. Tap <b>Record hand</b> after each hand.</p>`}
    </section>`;
  }

  /* ------------------------------------------------ tile editor */
  function TileEditor({ R, tiles, onChange }) {
    const [mode, setMode] = useState('tile');
    const [pickWin, setPickWin] = useState(false);
    const pickWinTile = (c) => { onChange(Object.assign({}, tiles, { win: c })); setPickWin(false); };
    const bonusSet = R.id === 'riichi' ? [] : R.id === 'sg' ? ['F', 'S', 'A'] : ['F', 'S'];
    const check = MJ.checkHand(tiles, R.handSize);
    const used = {};
    tiles.hand.forEach((c) => (used[c] = (used[c] || 0) + 1));
    tiles.melds.forEach((m) => { const i = MJ.ix(m.tile); const add = (c) => (used[c] = (used[c] || 0) + 1); if (m.type === 'chi') [0, 1, 2].forEach((k) => add(MJ.cd(i + k))); else for (let k = 0; k < (m.type === 'kan' ? 4 : 3); k++) add(m.tile); });
    function add(code) {
      setPickWin(false);
      if (MJ.isBonus(code)) { if (!tiles.bonus.includes(code)) onChange(Object.assign({}, tiles, { bonus: tiles.bonus.concat(code) })); return; }
      if (mode === 'tile') { onChange(Object.assign({}, tiles, { hand: tiles.hand.concat(code), win: code })); return; }
      const i = MJ.ix(code);
      if (mode === 'chi' && (i >= 27 || i % 9 > 6)) return;
      const meld = mode === 'chi' ? { type: 'chi', tile: code } : mode === 'pon' ? { type: 'pon', tile: code } : { type: 'kan', tile: code, concealed: mode === 'ckan' };
      onChange(Object.assign({}, tiles, { melds: tiles.melds.concat(meld) }));
      setMode('tile');
    }
    const sorted = MJ.sortTiles(tiles.hand);
    const wi = tiles.win ? sorted.lastIndexOf(tiles.win) : -1;
    const display = sorted.map((c, i) => ({ c, i })).filter((x) => x.i !== wi);
    function removeAt(c) {
      const hand = tiles.hand.slice(); const k = hand.lastIndexOf(c); if (k > -1) hand.splice(k, 1);
      let win = tiles.win;
      if (win && !hand.includes(win)) win = hand.length ? hand[hand.length - 1] : null;
      onChange(Object.assign({}, tiles, { hand, win }));
    }
    const tileBtn = (c) => {
      const u = used[c] || 0;
      if (MJ.isBonus(c)) return html`<${Tile} key=${c} code=${c} onClick=${() => add(c)} disabled=${tiles.bonus.includes(c)} />`;
      const i = MJ.ix(c);
      const need = mode === 'pon' ? 3 : mode === 'kan' || mode === 'ckan' ? 4 : 1;
      const blocked = mode === 'chi' ? i >= 27 || i % 9 > 6 || [0, 1, 2].some((k) => (used[MJ.cd(i + k)] || 0) >= 4) : u + need > 4;
      return html`<${Tile} key=${c} code=${c} onClick=${() => add(c)} badge=${u || null} disabled=${blocked} />`;
    };
    const suitRow = (sfx) => Array.from({ length: 9 }, (_, k) => (k + 1) + sfx);
    const bonusCodes = [];
    bonusSet.forEach((k) => [1, 2, 3, 4].forEach((n) => bonusCodes.push(k + n)));
    const board = html`<div class="board">
      <div class="brow"><span class="blabel"><b class="k">字</b> Winds and dragons</span><div class="palette p7">${['1z', '2z', '3z', '4z', '7z', '6z', '5z'].map(tileBtn)}</div></div>
      ${bonusCodes.length ? html`<div class="brow"><span class="blabel"><b class="k">花</b> Flowers${R.id === 'sg' ? ', seasons and animals' : ' and seasons'}</span><div class=${'palette ' + (bonusCodes.length > 8 ? 'p12' : 'p8')}>${bonusCodes.map(tileBtn)}</div></div>` : null}
      <div class="brow"><span class="blabel"><b class="k">萬</b> Characters</span><div class="palette">${suitRow('m').map(tileBtn)}</div></div>
      <div class="brow"><span class="blabel"><b class="k">筒</b> Dots</span><div class="palette">${suitRow('p').map(tileBtn)}</div></div>
      <div class="brow"><span class="blabel"><b class="k">索</b> Bamboo</span><div class="palette">${suitRow('s').map(tileBtn)}</div></div>
    </div>`;
    const modes = [['tile', 'Tile'], ['chi', 'Chow'], ['pon', 'Pung'], ['kan', 'Kong'], ['ckan', 'Hidden kong']];
    return html`<div class="handbox">
      <div class="zone">
        <div class="zone-h"><span>In hand</span><span class=${'counter' + (check.ok ? ' ok' : '')}>${check.have} of ${check.expected}</span></div>
        <div class="zone-tiles">
          ${display.map(({ c, i }) => html`<${Tile} code=${c} pressed=${pickWin} onClick=${() => (pickWin ? pickWinTile(c) : removeAt(c))} label=${(pickWin ? 'Make winning tile: ' : 'Remove ') + MJ.tileName(c)} badge=${pickWin ? null : '×'} />`)}
          ${tiles.win ? html`<span class="wingap"></span><${Tile} code=${tiles.win} win=${true} onClick=${() => (pickWin ? setPickWin(false) : removeAt(tiles.win))} label=${'Winning tile: ' + MJ.tileName(tiles.win) + (pickWin ? '' : ' (tap to remove)')} badge=${pickWin ? null : '×'} />` : null}
          ${!tiles.hand.length ? html`<span class="hint">Tap the tiles you won with on the board below. The last tile you add is marked as the winning tile.</span>` : null}
        </div>
        ${tiles.hand.length ? html`<div class="selbar">
          ${pickWin ? html`<span class="hint">Tap the tile you won with.</span><button type="button" class="btn small" onClick=${() => setPickWin(false)}>Done</button>`
          : html`<span class="hint">Tap a tile to remove it.</span>
            <button type="button" class="btn small" onClick=${() => onChange(Object.assign({}, tiles, { hand: tiles.hand.slice(0, -1), win: tiles.hand.length > 1 ? (tiles.win === tiles.hand[tiles.hand.length - 1] && tiles.hand.slice(0, -1).lastIndexOf(tiles.win) < 0 ? tiles.hand[tiles.hand.length - 2] : tiles.win) : null }))}>Undo last</button>
            ${tiles.hand.length > 1 ? html`<button type="button" class="btn small" onClick=${() => setPickWin(true)}>Change winning tile</button>` : null}`}
        </div>` : null}
      </div>
      ${tiles.melds.length || mode !== 'tile' ? html`<div class="zone">
        <div class="zone-h"><span>Melds (chow, pung, kong)</span></div>
        <div class="zone-tiles">${tiles.melds.map((m, k) => html`<span class="meld"><${MeldTiles} m=${m} size="sm" /><button type="button" class="mx" aria-label="Remove meld" onClick=${() => onChange(Object.assign({}, tiles, { melds: tiles.melds.filter((_, j) => j !== k) }))}>×</button></span>`)}
          ${!tiles.melds.length ? html`<span class="hint">${mode === 'chi' ? 'Tap the lowest tile of the chow.' : 'Tap the tile for this set.'}</span>` : null}
        </div>
      </div>` : null}
      ${bonusSet.length ? html`<div class="zone">
        <div class="zone-h"><span>Flowers${R.id === 'sg' ? ' and animals' : ''}</span>${tiles.bonus.length ? '' : html`<span>none</span>`}</div>

      </div>` : null}

  /* ------------------------------------------------ photo scan */
  function scanError(e) {
    const code = e && e.code;
    if (code === 'signin_required') return 'Sign in to read photos.';
    if (code === 'not_configured') return 'Photo reading isn’t switched on for this server yet. Tap the tiles in instead.';
    if (code === 'rate_limited') return (e && e.message) || 'Too many scans just now. Wait a minute, then try again.';
    if (code === 'image_rejected') return 'That photo couldn’t be opened. Try a JPEG taken with the camera.';
    if (code === 'offline') return 'No connection. Photo reading needs the internet.';
    if (code === 'refused' || code === 'empty_completion' || code === 'invalid_json') return 'The tiles couldn’t be read from that photo. Try a closer, straight-on shot in good light.';
    return (e && e.message) || 'The scan didn’t finish. Try again.';
  }
  // Shrink the photo to what the reader can use (1568 px on the long edge) and return it as base64 JPEG.
  async function prepImage(file, max) {
    max = max || 1568;
    let bmp = null;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { try { bmp = await createImageBitmap(file); } catch (e2) { bmp = null; } }
    let src = bmp, w, h, url = null;
    if (bmp) { w = bmp.width; h = bmp.height; }
    else {
      url = URL.createObjectURL(file);
      src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(Object.assign(new Error('bad image'), { code: 'image_rejected' })); im.src = url; });
      w = src.naturalWidth; h = src.naturalHeight;
    }
    if (!w || !h) throw Object.assign(new Error('bad image'), { code: 'image_rejected' });
    const scale = Math.min(1, max / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w * scale)); cv.height = Math.max(1, Math.round(h * scale));
    cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
    if (bmp && bmp.close) bmp.close();
    if (url) URL.revokeObjectURL(url);
    const dataUrl = cv.toDataURL('image/jpeg', 0.86);
    return { b64: dataUrl.slice(dataUrl.indexOf(',') + 1), type: 'image/jpeg', w: cv.width, h: cv.height };
  }

  }
  function cleanInput(R, d) {
    const x = clone(d);
    if (x.tiles && !x.tiles.hand.length && !x.tiles.melds.length) x.tiles = null;
    if (R.id !== 'riichi') delete x.riichi;
    if (R.id !== 'custom') { delete x.value; delete x.label; } else x.value = +x.value || 0;
    if (x.outcome === 'draw') { x.winner = null; x.discarder = null; x.tiles = null; x.manual = {}; x.liable = null; }

    const res = useMemo(() => MJ.evaluate(game, d), [game, d]);
    const up = (patch) => setD((prev) => Object.assign({}, prev, typeof patch === 'function' ? patch(prev) : patch));
    const riichi = R.id === 'riichi';
    const win = d.outcome === 'win';

    const words = howWords(R);

    const setRiichi = (patch) => up((prev) => ({ riichi: Object.assign({}, prev.riichi, patch) }));
    const toggleIn = (list, p) => (list.includes(p) ? list.filter((x) => x !== p) : list.concat(p).sort());

    async function runScan(file, tier) {
      if (!file) return;
      if (ctlRef.current) ctlRef.current.abort();
      const ctl = new AbortController(); ctlRef.current = ctl;
      const url = scan && scan.file === file ? scan.url : URL.createObjectURL(file);

      if (!Store.user) { setScan({ status: 'error', url, file, msg: 'Sign in to read photos.', signin: true }); return; }
      setScan({ status: 'reading', url, file, tier });
      try {
        const img = await prepImage(file);
        const r = await API.call('scan', { image: img.b64, mediaType: img.type, ruleset: R.id, tier: tier === 'complex' ? 'careful' : 'default', gameId: game.id }, { signal: ctl.signal });

        up((prev) => ({ tiles: parsed.tiles, scanId: r.scanId, riichi: riichi && parsed.redFives ? Object.assign({}, prev.riichi, { dora: (prev.riichi.dora || 0) + parsed.redFives }) : prev.riichi }));
        setScan({ status: 'done', url, file, tier, unsure: parsed.unsure, note: parsed.note, redFives: parsed.redFives, ms: r.ms });

        if (e && e.code === 'cancelled') { setScan({ status: 'idle', url, file }); return; }

    const ql = q.trim().toLowerCase();

          <${Seg} label="How it was won" value=${d.how} onChange=${(v) => up({ how: v })} options=${[['self', 'Self-draw', words[0]], ['discard', 'Discard', words[1]]]} />
          ${!selfDraw ? html`<p class="flabel" style=${{ marginTop: '4px' }}>Who discarded the winning tile?</p>
            <${PlayerChips} game=${game} value=${d.discarder} exclude=${d.winner} onPick=${(p) => up({ discarder: p })} />` : null}
        </div>
        ${R.valueEntry ? html`<div class="sec"><h3>Hand value</h3>
          <div class="field"><label for="cv">Points for this hand</label><input id="cv" class="input num" inputmode="decimal" value=${d.value} onInput=${(e) => up({ value: e.target.value })} placeholder="e.g. 8" /></div>
          <div class="field"><label for="cl">What was it? (optional)</label><input id="cl" class="input" value=${d.label} onInput=${(e) => up({ label: e.target.value.slice(0, 60) })} placeholder="e.g. 清一色 pure one suit" /></div>
        </div>` : html`
        <div class="sec"><h3>The winning hand</h3>
          ${R.manualOnly ? html`<p class="hint">Chinese Official has 81 fan with many “not counted with” rules, so tick the fan yourself below. Tiles help you check.</p>` : null}
          ${canScan ? html`<div class="scanrow">
              <button type="button" class="btn" onClick=${() => camRef.current && camRef.current.click()}>${I.camera}Take photo</button>
              <button type="button" class="btn" onClick=${() => picRef.current && picRef.current.click()}>${I.image}From photos</button>
            </div>
            <input ref=${camRef} type="file" accept="image/*" capture="environment" class="hidden-input" tabindex="-1" onChange=${onPick} />
            <input ref=${picRef} type="file" accept="image/*" class="hidden-input" tabindex="-1" onChange=${onPick} />` : null}
          ${scan ? html`<div class="scanstate">
              <button type="button" class="thumb" aria-label="View photo" onClick=${() => setViewPhoto(true)}><img src=${scan.url} alt="Photo of the hand" /></button>
              <div class="stack" style=${{ gap: '6px' }}>
                ${scan.status === 'reading' ? html`<div class="row"><span class="spinner" aria-hidden="true"></span><span>Reading the tiles${scan.tier === 'complex' ? ' carefully' : ''}…</span><button type="button" class="link" onClick=${() => ctlRef.current && ctlRef.current.abort()}>Stop</button></div>` : null}
                ${scan.status === 'done' ? html`<p><b>Tiles filled in${scan.ms ? ' in ' + (scan.ms / 1000).toFixed(1) + ' s' : ''}.</b> Check them against the photo and tap any tile to fix it.</p>` : null}
                ${scan.status === 'error' ? html`<p class="err">${scan.msg}</p>` : null}
                ${scan.status === 'error' && scan.signin && onSignIn ? html`<button type="button" class="btn small primary" style=${{ justifySelf: 'start' }} onClick=${onSignIn}>Sign in</button>` : null}
                ${scan.status !== 'reading' && !(scan.status === 'error' && scan.signin) && canScan ? html`<button type="button" class="link" style=${{ justifySelf: 'start' }} onClick=${() => runScan(scan.file, 'complex')}>Read again, more carefully</button>` : null}
              </div>
            </div>
            ${scan.status === 'done' && scan.unsure && scan.unsure.length ? html`<p class="warn">Double-check: ${scan.unsure.join('; ')}</p>` : null}
            ${scan.status === 'done' && scan.redFives ? html`<p class="hint">${scan.redFives} red five${scan.redFives > 1 ? 's' : ''} spotted and added to dora.</p>` : null}` : null}
          ${!scan && canScan ? html`<ul class="tips"><li>Lay the hand face up in one row, melds and flowers a little apart.</li><li>Fill the frame, straight on, in good light. Photos are kept 60 days to improve reading.</li></ul>` : null}
          ${!canScan && !LITE ? html`<p class="hint">Photo reading isn’t switched on for this server yet. Tap the tiles in instead.</p>` : null}
          ${d.tiles ? html`<${TileEditor} R=${R} tiles=${d.tiles} onChange=${(t) => up({ tiles: t })} />
            ${res.tileNote ? html`<p class="warn">${res.tileNote}</p>` : null}
            <button type="button" class="link" style=${{ justifySelf: 'start' }} onClick=${() => up({ tiles: null })}>Don’t use tiles, just tick patterns</button>`
          : html`<button type="button" class="btn" onClick=${() => up({ tiles: MJ.emptyHand() })}>${I.tiles}Pick the tiles on the board</button>
            <p class="hint">${R.detect ? 'Enter tiles to have the patterns picked for you, or tick them yourself below.' : 'Tick the fan yourself below.'}</p>`}
        </div>`}
        ${riichi ? html`<div class="sec"><h3>Dora and fu</h3>
          <div class="toggle-row"><span class="tl"><b>Dora</b><small>Dora, ura-dora and red fives together</small></span><${Stepper} label="dora" value=${d.riichi.dora || 0} min=${0} max=${20} onChange=${(v) => setRiichi({ dora: v })} /></div>
          ${res.det && res.det.fu ? html`<p class="hint">Fu from the tiles: <b class="num">${res.det.fu}</b></p>` : html`
            <div class="toggle-row"><span class="tl"><b>Closed hand</b><small>No chi, pon or open kan</small></span><${Switch} on=${d.riichi.closed !== false} onChange=${(v) => setRiichi({ closed: v })} label="Closed hand" /></div>
            <p class="flabel">Fu</p>
            <div class="chips fuchips">${[20, 25, 30, 40, 50, 60, 70, 80, 90, 100, 110].map((f) => html`<button type="button" class="chip" aria-pressed=${(+d.riichi.fu || 30) === f ? 'true' : 'false'} onClick=${() => setRiichi({ fu: f })}>${f}</button>`)}</div>
            <p class="hint">Seven pairs is always 25 fu and pinfu is 20 on a self-draw, whatever you pick.</p>`}
        </div>` : null}
        ${!R.valueEntry ? html`<div class="sec"><h3>Scoring</h3>
          ${rows.length ? html`<div class="receipt">${rows.map(({ p, n, fixed }) => {
            const lab = patLabel(R, p, selfDraw);
            const exBy = res.by[p.id];
            const auto = !fixed && (res.auto[p.id] || 0) > 0 && !(p.id in d.manual);
            const val = R.id === 'riichi' ? valueText(R, p, V, menzen) : V[p.id] === 'L' ? 'Limit' : (+V[p.id] || 0) * n;
            return html`<div class=${'rrow' + (exBy ? ' is-excl' : '')} key=${p.id}>
              <div class="rname"><span class="zh">${lab.zh}</span><span class="en">${lab.en}${n > 1 && p.max <= 1 ? ' ×' + n : ''}</span>
                ${exBy ? html`<span class="sub">Not counted with ${(R.patterns.find((x) => x.id === exBy) || {}).zh}</span>` : fixed ? html`<span class="sub">${fixed}</span>` : auto ? html`<span class="tag">from the tiles</span>` : null}
              </div>
              ${p.max > 1 && !fixed ? html`<${Stepper} label=${p.en} value=${n} min=${0} max=${p.max} onChange=${(v) => setCount(p.id, v)} />` : html`<span></span>`}
              <span style=${{ display: 'flex', alignItems: 'center', gap: '2px' }}><span class="rval">${val}</span>${fixed ? null : html`<button type="button" class="rx" aria-label=${'Remove ' + p.en} onClick=${() => setCount(p.id, 0)}>×</button>`}</span>
              ${explain && PATTERN_INFO[p.id] && PATTERN_INFO[p.id].d ? html`<div class="phelp"><p class="pdesc">${PATTERN_INFO[p.id].d}</p></div>` : null}
            </div>`;
          })}
          ${riichi && (d.riichi.dora || 0) > 0 && res.valid && !res.ym ? html`<div class="rrow"><div class="rname"><span class="zh">ドラ</span><span class="en">Dora</span></div><span></span><span class="rval">${d.riichi.dora} han</span></div>` : null}
          </div>` : html`<p class="hint">Nothing counted yet. ${d.tiles ? 'Finish the tiles or add patterns below.' : 'Add the patterns in this hand below.'}</p>`}
          ${Object.keys(d.manual).length ? html`<button type="button" class="link" style=${{ justifySelf: 'start' }} onClick=${() => up({ manual: {} })}>Undo my pattern changes</button>` : null}
          <details class="addlist" open=${!d.tiles}>
            <summary>Add a pattern</summary>
            <div class="addbody">
              <div class="toggle-row"><span class="tl"><b>Explain each pattern</b><small>Shows what it means under the example tiles</small></span><${Switch} on=${explain} onChange=${toggleExplain} label="Explain each pattern" /></div>
              ${R.patterns.length > 35 ? html`<input class="input" type="search" placeholder="Search patterns" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="Search patterns" />` : null}
              ${groupsOf(R).map((g) => {
                const list = addable.filter((p) => p.g === g && matches(p));
                if (!list.length) return null;
                return html`<div class="addgrp">${groupName(g)}</div>${list.map((p) => {
                  const lab = patLabel(R, p, selfDraw);
                  return html`<button type="button" class="addrow" key=${p.id} onClick=${() => setCount(p.id, 1)}><span class="plus" aria-hidden="true">+</span><span class="nm"><b>${lab.zh}</b><span>${lab.en}${p.note ? ' — ' + p.note : ''}</span></span><span class="v">${valueText(R, p, V, menzen)}</span><${PatternHelp} id=${p.id} showDesc=${explain} /></button>`;
                })}`;
              })}
            </div>
          </details>
        </div>` : null}
        ${R.id !== 'riichi' && R.id !== 'mcr' ? html`<div class="sec"><details><summary class="flabel" style=${{ cursor: 'pointer', minHeight: '32px' }}>One player pays for everyone (包)</summary>
          <p class="hint" style=${{ margin: '8px 0' }}>Use when a player is liable, for example they fed the tile that completed a limit hand.</p>
          <div class="chips">
            <button type="button" class="chip" aria-pressed=${d.liable == null ? 'true' : 'false'} onClick=${() => up({ liable: null })}>Nobody</button>
            ${[0, 1, 2, 3].filter((p) => p !== d.winner).map((p) => html`<button type="button" class="chip" aria-pressed=${d.liable === p ? 'true' : 'false'} onClick=${() => up({ liable: p })}>${pname(game, p)}</button>`)}
          </div></details></div>` : null}
      ` : html`
        <div class="sec">${riichi ? html`<h3>Who was tenpai?</h3>
          <${PlayerChips} game=${game} multi=${true} value=${d.draw.tenpai} onPick=${(p) => up((prev) => ({ draw: Object.assign({}, prev.draw, { tenpai: toggleIn(prev.draw.tenpai, p) }) }))} />
          <div class="toggle-row"><span class="tl"><b>Abortive draw</b><small>No tenpai payments; dealer stays</small></span><${Switch} on=${d.draw.abortive} onChange=${(v) => up((prev) => ({ draw: Object.assign({}, prev.draw, { abortive: v }) }))} label="Abortive draw" /></div>`
          : html`<p>No one won. Nothing is paid.</p><p class="hint">${R.id === 'mcr' ? 'The dealer passes to the next seat.' : R.id === 'tw' || game.settings.keepOnDraw ? 'The dealer stays for the next hand.' : 'The dealer passes to the next seat.'}</p>`}</div>`}
      ${viewPhoto && scan ? html`<div class="photo-view" role="dialog" aria-label="Photo" onClick=${() => setViewPhoto(false)}><img src=${scan.url} alt="Photo of the hand" /></div>` : null}
    <//>`;
  }

  /* ------------------------------------------------ payout / adjustment */
  function PayoutSheet({ game, onClose, onSaved }) {
    const R = RULES[game.ruleset];
    const [mode, setMode] = useState('each');
    const [who, setWho] = useState(null);
    const [other, setOther] = useState(null);
    const [amt, setAmt] = useState('');
    const [label, setLabel] = useState('');
    const a = Math.max(0, +amt || 0);
    const deltas = [0, 0, 0, 0];
    if (who != null && a > 0) {
      if (mode === 'each') [0, 1, 2, 3].forEach((p) => { if (p !== who) { deltas[p] -= a; deltas[who] += a; } });
      else if (mode === 'all') [0, 1, 2, 3].forEach((p) => { if (p !== who) { deltas[p] += a; deltas[who] -= a; } });
      else if (other != null && other !== who) { deltas[who] += a; deltas[other] -= a; }
    }
    const ok = deltas.some((x) => x !== 0);
    const unit = game.ruleset === 'riichi' ? 'points' : 'pts';
    function save() {
      if (!ok) return;
      const g = clone(game);
      const txt = label.trim() || (mode === 'each' ? pname(game, who) + ' collects ' + fmt(a) + ' from each' : mode === 'all' ? pname(game, who) + ' pays ' + fmt(a) + ' to each' : pname(game, other) + ' pays ' + pname(game, who));
      MJ.recordSide(g, deltas, txt);
      onSaved(g);
    }
    return html`<${Sheet} title="Payout or adjustment" sub="Kong money, bites, penalties, corrections" onClose=${onClose}
      foot=${html`<div class="sumrow"><div class="pays" style=${{ marginTop: 0 }}>${ok ? deltas.map((x, p) => html`<span class=${cls(x)}><small>${pname(game, p)}</small>${signed(x)}</span>`) : html`<span class="muted">Pick a player and an amount</span>`}</div><button type="button" class="btn primary" disabled=${!ok} onClick=${save}>Save</button></div>`}>
      ${R.instant ? html`<div class="sec"><h3>Instant payouts</h3><div class="chips">${R.instant.map((x) => html`<button type="button" class="chip" onClick=${() => { setMode('each'); setAmt(String(x.each)); setLabel(x.en + (x.zh ? ' ' + x.zh : '')); }}>${x.zh ? html`<span class="cw">${x.zh}</span>` : null}${x.en} · ${x.each}</button>`)}</div><p class="hint">Each other player pays the winner of the bonus. Amounts are editable below.</p></div>` : null}
      <div class="sec"><h3>Type</h3>
        <${Seg} label="Payment type" value=${mode} onChange=${setMode} options=${[['each', 'Everyone pays one'], ['all', 'One pays everyone'], ['one', 'One pays one']]} />
      </div>
      <div class="sec"><h3>${mode === 'each' ? 'Who collects' : mode === 'all' ? 'Who pays' : 'Who receives'}</h3>
        <${PlayerChips} game=${game} value=${who} onPick=${setWho} />
        ${mode === 'one' ? html`<p class="flabel">Who pays</p><${PlayerChips} game=${game} value=${other} exclude=${who} onPick=${setOther} />` : null}
      </div>
      <div class="sec">
        <div class="field"><label for="pa">Amount ${mode === 'one' ? '' : 'per player'} (${unit})</label><input id="pa" class="input num" inputmode="decimal" value=${amt} onInput=${(e) => setAmt(e.target.value)} placeholder="e.g. 2" /></div>
        <div class="field"><label for="pl">Note (optional)</label><input id="pl" class="input" value=${label} onInput=${(e) => setLabel(e.target.value.slice(0, 60))} placeholder="e.g. 詐糊 false win" /></div>
      </div>
    <//>`;
  }

  /* ------------------------------------------------ settings controls */
  function SettingControl({ s, value, onChange }) {
    if (s.type === 'bool') return html`<div class="toggle-row"><span class="tl"><b>${s.label}</b></span><${Switch} on=${!!value} onChange=${onChange} label=${s.label} /></div>`;
    if (s.type === 'select') return html`<div class="field"><label for=${'s-' + s.key}>${s.label}</label><select id=${'s-' + s.key} class="select" value=${value} onChange=${(e) => onChange(e.target.value)}>${s.options.map(([v, t]) => html`<option value=${v}>${t}</option>`)}</select></div>`;
    const step = s.step || 1;
    const big = s.max > 100;
    return html`<div class="toggle-row"><span class="tl"><b>${s.label}${s.zh ? html` <span class="k muted">${s.zh}</span>` : null}</b></span>
      ${big ? html`<input id=${'s-' + s.key} class="input num" style=${{ width: '130px' }} inputmode="numeric" value=${value} onInput=${(e) => { const v = parseInt(e.target.value.replace(/[^0-9]/g, ''), 10); onChange(isNaN(v) ? s.min : Math.min(s.max, v)); }} aria-label=${s.label} />`
        : html`<${Stepper} label=${s.label} value=${+value} min=${s.min} max=${s.max} step=${step} onChange=${onChange} />`}
    </div>`;
  }

  /* ------------------------------------------------ setup */
  const PREF_KEY = 'mjsb.pref';
  function loadPref() { try { return JSON.parse(lsGet(PREF_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function Setup({ onCancel, onCreate }) {
    // Smart defaults: the last table's rules, names and stakes are already filled in, so this is "scan and adjust", not "fill in".
    const pref = useMemo(loadPref, []);
    const lastGame = useMemo(() => Store.list()[0] || null, []);
    const [rs, setRs] = useState(pref.rs && RULES[pref.rs] ? pref.rs : 'hk');
    const [names, setNames] = useState(() => (pref.names && pref.names.length === 4 ? pref.names.slice() : lastGame ? lastGame.players.map((p) => p.name) : ['', '', '', '']));
    const [settings, setSettings] = useState({});
    const [per, setPer] = useState(pref.per != null ? String(pref.per || '') : '');
    const [sym, setSym] = useState(pref.sym != null ? pref.sym : 'Rp');
    const [stakesSeen, setStakesSeen] = useState(false);
    const R = RULES[rs];
    const S = Object.assign({}, MJ.newGame({ ruleset: rs, players: [{}, {}, {}, {}] }).settings, settings);
    const namesDone = names.filter((n) => n.trim()).length >= 2;
    const stakesDone = stakesSeen || per !== '';
    // Head start: the rules are already chosen, so the bar never starts at zero.
    const done = 1 + (namesDone ? 1 : 0) + (stakesDone ? 1 : 0);
    const pct = Math.round((done / 4) * 100);
    const prefilled = !!(pref.names && pref.names.some((n) => n)) || !!lastGame;
    function create() {
      const g = MJ.newGame({ ruleset: rs, players: names.map((n, i) => ({ name: n.trim() || 'Player ' + (i + 1) })), settings: S, money: { per: +per || 0, symbol: sym.trim() } });
      lsSet(PREF_KEY, JSON.stringify({ rs, names: names.map((n) => n.trim()), per: +per || 0, sym: sym.trim() }));
      onCreate(g);
    }
    return html`<div class="topbar"><div class="topbar-in"><button type="button" class="backbtn" onClick=${onCancel}>${I.back}Back</button><div class="ttl"><b>New table</b></div><span style=${{ width: '64px' }}></span></div></div>
      <main class="wrap">
        <div style=${{ marginTop: '12px' }}>
          <div class="steps"><span><b>${done} of 4</b> ready</span><span>${done >= 3 ? 'Just tap Start' : namesDone ? 'Stakes are optional' : 'Add the players'}</span></div>
          <div class="progress" role="progressbar" aria-valuenow=${pct} aria-valuemin="0" aria-valuemax="100"><i style=${{ width: pct + '%' }}></i></div>
        </div>
        <div class="sec"><h3>Rules ${pref.rs ? '· same as last time' : ''}</h3>
          <div class="rgrid">${MJ.ORDER.map((id) => { const r = RULES[id]; return html`<button type="button" class="rcard" aria-pressed=${rs === id ? 'true' : 'false'} onClick=${() => { setRs(id); setSettings({}); }}><b>${r.name}</b><span class="kn">${r.native}</span><span>${r.blurb}</span></button>`; })}</div>
        </div>
        <div class="sec"><h3>Players ${prefilled && namesDone ? '· same as last time' : ''}</h3>
          <div class="card" style=${{ padding: '10px 16px' }}>
            <div class="pgrid">${[0, 1, 2, 3].map((i) => html`<div class="prow"><${Tile} code=${(i + 1) + 'z'} size="sm" label=${MJ.WINDS[i] + ' seat'} /><input id=${'pn' + i} class="input" value=${names[i]} placeholder=${i === 0 ? 'First dealer' : 'Player ' + (i + 1)} maxlength="24" onInput=${(e) => { const n = names.slice(); n[i] = e.target.value; setNames(n); }} aria-label=${'Player ' + (i + 1) + ' name'} /></div>`)}</div>
            <p class="hint" style=${{ padding: '8px 0 4px' }}>In turn order, starting with the first dealer. Seats stay fixed; the dealer marker moves.</p>
          </div>
        </div>
        <div class="sec"><h3>${R.name} settings</h3>
          <div class="card"><details>
            <summary><span>Usual ${R.name} defaults<small>${R.settings.length} setting${R.settings.length === 1 ? '' : 's'} · tap to adjust</small></span></summary>
            <div class="settings">${R.settings.map((s) => html`<${SettingControl} s=${s} value=${S[s.key]} onChange=${(v) => setSettings(Object.assign({}, settings, { [s.key]: v }))} />`)}
            ${R.id === 'hk' || R.id === 'sg' || R.id === 'tw' ? html`<p class="hint">Pattern values can be changed per game from the game menu.</p>` : null}</div>
          </details></div>
        </div>
        <div class="sec"><h3>Stakes · optional</h3>
          <div class="card" style=${{ padding: '12px 16px 14px' }} onFocusCapture=${() => setStakesSeen(true)}>
            <div class="row" style=${{ alignItems: 'end' }}>
              <div class="field" style=${{ flex: '0 0 96px' }}><label for="sym">Currency</label><input id="sym" class="input" value=${sym} maxlength="4" onInput=${(e) => setSym(e.target.value)} /></div>
              <div class="field" style=${{ flex: '1 1 160px' }}><label for="per">${rs === 'riichi' ? 'Per 1,000 points' : 'Per point'}</label><input id="per" class="input num" inputmode="decimal" value=${per} placeholder="Points only" onInput=${(e) => setPer(e.target.value)} /></div>
            </div>
            <p class="hint" style=${{ marginTop: '8px' }}>Leave it empty to score in points only. You can set it later from Rules and values.</p>
          </div>
        </div>
        <div class="sec"><button type="button" class="btn primary big block" onClick=${create}>Start the table</button></div>
      </main>`;
  }

  /* ------------------------------------------------ rules & values */
  function RulesSheet({ game, onClose, onSaved }) {
    const R = RULES[game.ruleset];
    const [S, setS] = useState(Object.assign({}, game.settings));
    const [vals, setVals] = useState(Object.assign({}, game.values || {}));
    const V = Object.assign({}, MJ.valuesOf(Object.assign({}, game, { values: {} })), R.fixedValues ? {} : vals);
    function save() { const g = clone(game); g.settings = S; g.values = vals; onSaved(g); }
    return html`<${Sheet} tall=${true} title="Rules and values" sub=${R.name + ' · changes apply to new hands'} onClose=${onClose}
      foot=${html`<div class="row" style=${{ justifyContent: 'flex-end' }}><button type="button" class="btn" onClick=${onClose}>Cancel</button><button type="button" class="btn primary" onClick=${save}>Save rules</button></div>`}>
      <div class="sec"><h3>Settings</h3><div class="settings">${R.settings.map((s) => html`<${SettingControl} s=${s} value=${S[s.key]} onChange=${(v) => setS(Object.assign({}, S, { [s.key]: v }))} />`)}</div></div>
      ${R.patterns.length ? html`<div class="sec"><h3>${R.fixedValues ? 'Values' : 'Values (edit to match your table)'}</h3>
        <div class="vtable">${groupsOf(R).map((gk) => html`<div class="addgrp">${groupName(gk)}</div>${R.patterns.filter((p) => p.g === gk).map((p) => {
          const cur = V[p.id];
          const control = R.fixedValues ? html`<span class="num" style=${{ textAlign: 'right' }}>${valueText(R, p, V, true)}</span>`
            : p.v === 'L' || cur === 'L' ? html`<select class="select" value=${cur === 'L' ? 'L' : String(cur)} onChange=${(e) => setVals(Object.assign({}, vals, { [p.id]: e.target.value === 'L' ? 'L' : +e.target.value }))} aria-label=${p.en}>${['L'].concat(Array.from({ length: 14 }, (_, i) => String(i))).map((o) => html`<option value=${o}>${o === 'L' ? 'Limit' : o}</option>`)}</select>`
            : html`<input class="input num" inputmode="numeric" value=${cur} aria-label=${p.en} onInput=${(e) => { const v = parseInt(e.target.value, 10); setVals(Object.assign({}, vals, { [p.id]: isNaN(v) ? 0 : Math.max(0, Math.min(99, v)) })); }} />`;
          return html`<div class="vrow"><span class="nm"><b>${p.zh}</b><span>${p.en}${p.note ? ' — ' + p.note : ''}</span></span>${control}</div>`;
        })}`)}</div>
        ${!R.fixedValues ? html`<button type="button" class="link" onClick=${() => setVals({})}>Reset values to defaults</button>` : null}
      </div>` : null}
    <//>`;
  }

  /* ------------------------------------------------ names */

  /* ------------------------------------------------ standings & export */
  function csvOf(game) {
    const R = RULES[game.ruleset];
    const esc = (s) => { s = String(s == null ? '' : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ['#', 'Round', 'Result', 'Winner', 'How', 'Discarder', 'Value', 'Patterns'].concat(game.players.map((p, i) => pname(game, i)));
    const lines = [head.map(esc).join(',')];
    let n = 0;
    for (const e of game.entries) {
      if (e.kind === 'side') { lines.push([''].concat(['', 'Payout', '', '', '', '', e.label]).concat(e.deltas).map(esc).join(',')); continue; }
      n++;
      lines.push([n, MJ.roundLabel(game, e.before), e.outcome, e.winner != null ? pname(game, e.winner) : '', e.how || '', e.discarder != null ? pname(game, e.discarder) : '', e.outcome === 'win' ? e.text : '', (e.patterns || []).join(' + ')].concat(e.deltas).map(esc).join(','));
    }
    lines.push(['', '', 'Total', '', '', '', '', ''].concat(MJ.totals(game)).map(esc).join(','));
    return lines.join('\n');
  }
  function summaryText(game) {
    const R = RULES[game.ruleset];
    const rows = MJ.standings(game);
    const d = new Date(game.createdAt);
    const out = ['Mahjong · ' + R.name + ' rules · ' + d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })];
    rows.forEach((r, i) => {
      const riichi = game.ruleset === 'riichi';
      const main = riichi ? fmt(r.points) + ' (' + (r.final > 0 ? '+' : '') + r.final + ')' : signed(r.points);
      const m = riichi ? moneyFor(game, (r.final || 0) * 1000) : moneyFor(game, r.points);
      out.push((i + 1) + '. ' + pname(game, r.p) + '  ' + main + (m ? '  ' + m : ''));
    });
    out.push(game.entries.filter((e) => e.kind === 'hand').length + ' hands');
    return out.join('\n');
  }
  function moneyText(game, v) {
    const m = game.money || {};
    return (m.symbol ? m.symbol + ' ' : '') + fmt(Math.abs(v));
  }
  function EndSheet({ game, onClose, onSaved, onToast }) {
    const rows = MJ.standings(game);
    const riichi = game.ruleset === 'riichi';
    const [copyText, setCopyText] = useState(null);
    const share = canShareFiles();
    async function copy() {
      const t = summaryText(game);
      try { await navigator.clipboard.writeText(t); onToast('Summary copied'); }
      catch (e) { setCopyText(t); }
    }
    async function exportFile(name, data, type) {
      try {
        if (share) { await shareText(name, data, type); return; }
        downloadText(name, data, type); onToast('Download started');
      } catch (e) { if (!(e && e.name === 'AbortError')) { try { downloadText(name, data, type); onToast('Download started'); } catch (e2) { onToast('That export didn’t work here'); } } }
    }
    const stamp = new Date(game.createdAt).toISOString().slice(0, 10);
    const hasMoney = +(game.money && game.money.per) > 0;
    const nets = hasMoney ? MJ.moneyNets(game) : (riichi ? rows.reduce((a, r) => { a[r.p] = (r.final || 0) * 1000; return a; }, [0, 0, 0, 0]) : MJ.totals(game));
    const transfers = MJ.settle(nets);
    const amountText = (v) => hasMoney ? moneyText(game, v) : riichi ? fmt(v / 1000) : fmt(v) + ' pts';
    return html`<${Sheet} title="Standings" sub=${RULES[game.ruleset].name + (game.finished ? ' · finished' : ' · in progress')} onClose=${onClose}
      foot=${html`<div class="row" style=${{ justifyContent: 'space-between' }}>
        <button type="button" class="btn" onClick=${() => { const g = clone(game); g.finished = !g.finished; onSaved(g); }}>${game.finished ? 'Reopen game' : 'Finish game'}</button>
        <button type="button" class="btn primary" onClick=${copy}>Copy summary</button></div>`}>
      <div class="sec stand">${rows.map((r, i) => html`<div class="srow"><span class="srank">${i + 1}</span><span class="snm">${pname(game, r.p)}</span>
        <span class="sval">${riichi ? html`${(r.final > 0 ? '+' : '') + r.final}<small>${fmt(r.points)} pts</small>` : html`<span class=${cls(r.points)}>${signed(r.points)}</span>`}
        ${riichi ? (moneyFor(game, (r.final || 0) * 1000) ? html`<small>${moneyFor(game, (r.final || 0) * 1000)}</small>` : null) : moneyFor(game, r.points) ? html`<small>${moneyFor(game, r.points)}</small>` : null}</span></div>`)}
      ${riichi ? html`<p class="hint" style=${{ marginTop: '10px' }}>Final = (points − ${fmt(game.settings.returnPoints)}) ÷ 1,000 + uma, with the oka and any sticks left on the table to first place.</p>` : null}</div>
      <div class="sec"><h3>Settle up</h3>
        ${transfers.length ? html`<div class="settle">${transfers.map((t, k) => html`<div class="trow" key=${k}><span class="tw">${pname(game, t.from)}<em>pays</em>${pname(game, t.to)}</span><span class="ta">${amountText(t.amount)}</span></div>`)}</div>
          <p class="hint">${hasMoney ? 'The fewest transfers that settle everyone at ' + moneyText(game, game.money.per) + (riichi ? ' per 1,000 points.' : ' per point.') : 'No stakes were set for this game, so this is in ' + (riichi ? 'final score units.' : 'points.') + ' Set money per point under Rules and values.'}</p>`
        : html`<p class="hint">Nobody owes anything yet.</p>`}
      </div>
      ${copyText ? html`<div class="sec"><p class="hint">Copying isn’t allowed here. Select the text and copy it yourself.</p><textarea class="copybox" readonly value=${copyText} onFocus=${(e) => e.target.select()}></textarea></div>` : null}
      <div class="sec"><h3>Export</h3><div class="row">
        <button type="button" class="btn primary" onClick=${() => saveRecap(game, onToast).catch(() => onToast('Could not make the recap image'))}>Save recap image</button>
        <button type="button" class="btn" onClick=${() => exportFile('mahjong-' + stamp + '.csv', csvOf(game), 'text/csv')}>Hands as CSV</button>
        <button type="button" class="btn" onClick=${() => exportFile('mahjong-' + stamp + '.json', JSON.stringify(game, null, 1), 'application/json')}>Full backup (JSON)</button>
      </div><p class="hint">Without a recap this match disappears: tables unused for ${Store.inactiveDays} days are deleted. The image keeps the standings, who pays whom and every hand. ${share ? 'Files open the share sheet, so you can save them or send them to a friend.' : 'Files download to this device.'} A JSON backup can be imported again from the home screen.</p></div>
    <//>`;
  }

  /* ------------------------------------------------ sign in & account */
  function SignInSheet({ onClose, onDone, initialMode }) {
    const [name, setName] = useState(lsGet('mjsb.name') || '');
    const [pin, setPin] = useState('');
    const [mode, setMode] = useState(initialMode || 'signin'); // signin | create | guest
    const [guestCode, setGuestCode] = useState('');
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');
    const create = mode === 'create';
    const ok = name.trim().length >= 2 && /^[^\s]{4,32}$/.test(pin);
    async function go() {
      if (!ok || busy) return;
      setBusy(true); setErr('');
      try {
        await Store.signIn(name.trim(), pin, create);
        lsSet('mjsb.name', name.trim());
        onDone();
      } catch (e) {
        if (e.code === 'no_such_user') { setMode('create'); setErr('No account has that name yet. Tap “Create account” to start one with this name and password.'); }
        else if (e.code === 'name_taken') { setMode('signin'); setErr('That name already has an account. Enter its password to sign in.'); }
        else setErr(e.message || 'Could not sign in.');
      }
      setBusy(false);
    }
    async function guestNew() {
      if (busy) return;
      setBusy(true); setErr('');
      try { const id = await Store.guestStart(); onDone('Your guest id is ' + id.replace(/^guest-/, '') + ' — share it with your table'); }
      catch (e) { setErr(e.message || 'Could not start as a guest.'); }
      setBusy(false);
    }
    async function guestJoin() {
      const code = 'guest-' + guestCode.trim().toUpperCase().replace(/^GUEST-/, '');
      if (!/^guest-[A-Z2-9]{6}$/.test(code) || busy) { setErr('A guest id is 6 letters or numbers, like K7M2XQ.'); return; }
      setBusy(true); setErr('');
      try { await Store.signIn(code, code, false); onDone(); }
      catch (e) { setErr(e.code === 'no_such_user' ? 'No table has that guest id (ids expire after ' + Store.inactiveDays + ' days without use).' : (e.message || 'Could not join.')); }
      setBusy(false);
    }

    if (mode === 'guest') return html`<${Sheet} title=${hasLocal ? 'Keep your table' : 'Play as a guest'} sub="No account needed" onClose=${onClose}
      foot=${html`<div class="row" style=${{ justifyContent: 'flex-end' }}><button type="button" class="btn primary" disabled=${busy} onClick=${guestNew}>${busy ? 'One moment…' : 'New guest table'}</button></div>`}>
