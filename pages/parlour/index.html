  };
  function exampleTiles(id) {
    const info = PATTERN_INFO[id];
    if (!info || !info.ex) return null;
    const e = info.ex;
    // The winning tile is deliberately not highlighted in examples: any tile of the hand may have been the last one.
    return { hand: MJ.parse(e.hand), melds: e.melds || [], win: null, bonus: e.bonus || [] };
  }
  function PatternHelp({ id, showDesc }) {
    const info = PATTERN_INFO[id];
    if (!info) return null;
    const t = exampleTiles(id);
    return html`<div class="phelp">
      ${t ? html`<${HandView} tiles=${t} size="xs" />` : null}
      ${showDesc && info.d ? html`<p class="pdesc">${info.d}</p>` : null}
    </div>`;
  }

  /* ------------------------------------------------ record a hand */
  function freshDraft() {
    return { outcome: 'win', winner: null, how: 'discard', discarder: null, tiles: MJ.emptyHand(), manual: {}, liable: null,
      riichi: { declared: [], dora: 0, fu: 30, closed: true }, draw: { tenpai: [], abortive: false }, value: '', label: '' };
  }
  function cleanInput(R, d) {
    const x = clone(d);
    if (x.tiles && !x.tiles.hand.length && !x.tiles.melds.length) x.tiles = null;
    if (R.id !== 'riichi') delete x.riichi;
    if (R.id !== 'custom') { delete x.value; delete x.label; } else x.value = +x.value || 0;
    if (x.outcome === 'draw') { x.winner = null; x.discarder = null; x.tiles = null; x.manual = {}; x.liable = null; }
    if (x.how === 'self') x.discarder = null;
    return x;
  }
  function RecordSheet({ game, onClose, onSaved, onSignIn }) {
    const R = RULES[game.ruleset];
    const st = game.state;
    const [d, setD] = useState(freshDraft);
    const [scan, setScan] = useState(null);
    const [viewPhoto, setViewPhoto] = useState(false);
    const [q, setQ] = useState('');
    const [explain, setExplain] = useState(() => lsGet('mjsb.explain') === '1');
    const toggleExplain = (v) => { setExplain(v); lsSet('mjsb.explain', v ? '1' : '0'); };
    const camRef = useRef(null), picRef = useRef(null), ctlRef = useRef(null);
    const res = useMemo(() => MJ.evaluate(game, d), [game, d]);
    const up = (patch) => setD((prev) => Object.assign({}, prev, typeof patch === 'function' ? patch(prev) : patch));
    const riichi = R.id === 'riichi';
    const win = d.outcome === 'win';
    const selfDraw = d.how === 'self';
    const words = howWords(R);
    const V = MJ.valuesOf(game);
    const menzen = res.det ? res.det.menzen : d.riichi.closed !== false;
    useEffect(() => () => { if (ctlRef.current) ctlRef.current.abort(); if (scan && scan.url) URL.revokeObjectURL(scan.url); }, []);

    const setCount = (id, n) => up((prev) => ({ manual: Object.assign({}, prev.manual, { [id]: n }) }));
    const setRiichi = (patch) => up((prev) => ({ riichi: Object.assign({}, prev.riichi, patch) }));
    const toggleIn = (list, p) => (list.includes(p) ? list.filter((x) => x !== p) : list.concat(p).sort());

    async function runScan(file, tier) {
      if (!file) return;
      if (ctlRef.current) ctlRef.current.abort();
      const ctl = new AbortController(); ctlRef.current = ctl;
      const url = scan && scan.file === file ? scan.url : URL.createObjectURL(file);
      if (scan && scan.url && scan.url !== url) URL.revokeObjectURL(scan.url);
      if (!Store.user) { setScan({ status: 'error', url, file, msg: 'Sign in to read photos.', signin: true }); return; }
      setScan({ status: 'reading', url, file, tier });
      try {
        const img = await prepImage(file);
        const r = await API.call('scan', { image: img.b64, mediaType: img.type, ruleset: R.id, tier: tier === 'complex' ? 'careful' : 'default', gameId: game.id }, { signal: ctl.signal });
        const parsed = MJ.parseScan(r.result, R);
        up((prev) => ({ tiles: parsed.tiles, scanId: r.scanId, riichi: riichi && parsed.redFives ? Object.assign({}, prev.riichi, { dora: (prev.riichi.dora || 0) + parsed.redFives }) : prev.riichi }));
        setScan({ status: 'done', url, file, tier, unsure: parsed.unsure, note: parsed.note, redFives: parsed.redFives, ms: r.ms });
        Store.bumpScans();
      } catch (e) {
        if (e && e.code === 'cancelled') { setScan({ status: 'idle', url, file }); return; }
        setScan({ status: 'error', url, file, msg: scanError(e), signin: e && e.code === 'signin_required' });
      }
    }
    const onPick = (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) runScan(f, 'default'); };
    const canScan = !LITE && Store.canScan !== false;

    /* receipt rows */
    const rows = [];
    if (win) {
      for (const p of R.patterns) {
        const n = res.counts[p.id] || 0;
        if (!n) continue;
        if (riichi && p.id === 'riichi') { rows.push({ p, n, fixed: 'from Riichi declared' }); continue; }
        rows.push({ p, n, fixed: p.src === 'how' ? 'from Self-draw above' : null });
      }
    }
    const addable = R.patterns.filter((p) => !(res.counts[p.id] > 0) && !(p.src === 'how') && !(riichi && p.id === 'riichi'));
    const ql = q.trim().toLowerCase();
    const matches = (p) => !ql || p.en.toLowerCase().includes(ql) || (p.zh || '').includes(q.trim());

    const pays = res.deltas || [0, 0, 0, 0];
    const summary = () => {
      if (!win) {
        const any = pays.some((x) => Math.abs(x) > 0.004);
        return html`<div class="sumv"><b>Draw</b><span>${any ? 'Tenpai payments and riichi sticks below' : 'No payments'}</span></div>`;
      }
      if (!res.valid) return html`<div class="sumv"><b>${res.text || 'Not ready'}</b><span class="err">${res.reason}</span></div>`;
      return html`<div class="sumv"><b>${res.text}</b><span>${res.detail || ''}</span></div>`;
    };
    const canSave = !win || res.valid;
    function save() {
      if (!canSave) return;
      const g = clone(game);
      const input = cleanInput(R, d);
      let entry;
      try { entry = MJ.recordHand(g, input); } catch (e) { return; }
      if (d.scanId && input.tiles) {
        entry.scanId = d.scanId;
        API.call('scanFinal', { scanId: d.scanId, tiles: input.tiles }).catch(() => {});
      }
      onSaved(g);
    }

    const foot = html`<div class="sumrow">${summary()}<button type="button" class="btn primary big" disabled=${!canSave} onClick=${save}>Save hand</button></div>
      ${(!win || res.valid) && pays.some((x) => Math.abs(x) > 0.004) ? html`<div class="pays">${pays.map((x, p) => html`<span class=${cls(x)}><small>${pname(game, p)}</small>${signed(x)}</span>`)}</div>` : null}`;

    return html`<${Sheet} tall=${true} title="Record a hand" sub=${MJ.roundLabel(game) + ' · dealer ' + pname(game, st.dealer)} onClose=${onClose} foot=${foot}>
      <div class="sec">
        <${Seg} label="Result" value=${d.outcome} onChange=${(v) => up({ outcome: v })} options=${[['win', 'Someone won'], ['draw', 'Draw', '流局']]} />
      </div>
      ${riichi ? html`<div class="sec"><h3>Riichi declared this hand</h3>
        <${PlayerChips} game=${game} multi=${true} value=${d.riichi.declared} onPick=${(p) => setRiichi({ declared: toggleIn(d.riichi.declared, p) })} />
        <p class="hint">Each declarer puts 1,000 on the table. The winner collects every stick there.</p></div>` : null}
      ${win ? html`
        <div class="sec"><h3>Who won</h3>
          <${PlayerChips} game=${game} value=${d.winner} onPick=${(p) => up((prev) => ({ winner: p, discarder: prev.discarder === p ? null : prev.discarder }))} />
        </div>
        <div class="sec"><h3>How</h3>
          <${Seg} label="How it was won" value=${d.how} onChange=${(v) => up({ how: v })} options=${[['self', 'Self-draw', words[0]], ['discard', 'Discard', words[1]]]} />
          ${!selfDraw ? html`<p class="flabel" style=${{ marginTop: '4px' }}>Who discarded the winning tile?</p>
            <${PlayerChips} game=${game} value=${d.discarder} exclude=${d.winner} onPick=${(p) => up({ discarder: p })} />` : null}
        </div>
        ${R.valueEntry ? html`<div class="sec"><h3>Hand value</h3>
          <div class="field"><label for="cv">Points for this hand</label><input id="cv" class="input num" inputmode="decimal" value=${d.value} onInput=${(e) => up({ value: e.target.value })} placeholder="e.g. 8" /></div>
          <div class="field"><label for="cl">What was it? (optional)</label><input id="cl" class="input" value=${d.label} onInput=${(e) => up({ label: e.target.value.slice(0, 60) })} placeholder="e.g. 清一色 pure one suit" /></div>
        </div>` : html`
        <div class="sec"><h3>The winning hand</h3>
          ${R.manualOnly ? html`<p class="hint">Chinese Official has 81 fan with many “not counted with” rules, so tick the fan yourself below. Tiles help you check.</p>` : null}
          ${canScan ? html`<div class="scanrow">
              <button type="button" class="btn" onClick=${() => camRef.current && camRef.current.click()}>${I.camera}Take photo</button>
              <button type="button" class="btn" onClick=${() => picRef.current && picRef.current.click()}>${I.image}From photos</button>
            </div>
            <input ref=${camRef} type="file" accept="image/*" capture="environment" class="hidden-input" tabindex="-1" onChange=${onPick} />
            <input ref=${picRef} type="file" accept="image/*" class="hidden-input" tabindex="-1" onChange=${onPick} />` : null}
          ${scan ? html`<div class="scanstate">
              <button type="button" class="thumb" aria-label="View photo" onClick=${() => setViewPhoto(true)}><img src=${scan.url} alt="Photo of the hand" /></button>
              <div class="stack" style=${{ gap: '6px' }}>
                ${scan.status === 'reading' ? html`<div class="row"><span class="spinner" aria-hidden="true"></span><span>Reading the tiles${scan.tier === 'complex' ? ' carefully' : ''}…</span><button type="button" class="link" onClick=${() => ctlRef.current && ctlRef.current.abort()}>Stop</button></div>` : null}
                ${scan.status === 'done' ? html`<p><b>Tiles filled in${scan.ms ? ' in ' + (scan.ms / 1000).toFixed(1) + ' s' : ''}.</b> Check them against the photo and tap any tile to fix it.</p>` : null}
                ${scan.status === 'error' ? html`<p class="err">${scan.msg}</p>` : null}
                ${scan.status === 'error' && scan.signin && onSignIn ? html`<button type="button" class="btn small primary" style=${{ justifySelf: 'start' }} onClick=${onSignIn}>Sign in</button>` : null}
                ${scan.status !== 'reading' && !(scan.status === 'error' && scan.signin) && canScan ? html`<button type="button" class="link" style=${{ justifySelf: 'start' }} onClick=${() => runScan(scan.file, 'complex')}>Read again, more carefully</button>` : null}
              </div>
            </div>
            ${scan.status === 'done' && scan.unsure && scan.unsure.length ? html`<p class="warn">Double-check: ${scan.unsure.join('; ')}</p>` : null}
            ${scan.status === 'done' && scan.redFives ? html`<p class="hint">${scan.redFives} red five${scan.redFives > 1 ? 's' : ''} spotted and added to dora.</p>` : null}` : null}
          ${!scan && canScan ? html`<ul class="tips"><li>Lay the hand face up in one row, melds and flowers a little apart.</li><li>Fill the frame, straight on, in good light. Photos are kept 60 days to improve reading.</li></ul>` : null}
          ${!canScan && !LITE ? html`<p class="hint">Photo reading isn’t switched on for this server yet. Tap the tiles in instead.</p>` : null}
          ${d.tiles ? html`<${TileEditor} R=${R} tiles=${d.tiles} onChange=${(t) => up({ tiles: t })} />
            ${res.tileNote ? html`<p class="warn">${res.tileNote}</p>` : null}
            <button type="button" class="link" style=${{ justifySelf: 'start' }} onClick=${() => up({ tiles: null })}>Don’t use tiles, just tick patterns</button>`
          : html`<button type="button" class="btn" onClick=${() => up({ tiles: MJ.emptyHand() })}>${I.tiles}Pick the tiles on the board</button>
            <p class="hint">${R.detect ? 'Enter tiles to have the patterns picked for you, or tick them yourself below.' : 'Tick the fan yourself below.'}</p>`}
        </div>`}
        ${riichi ? html`<div class="sec"><h3>Dora and fu</h3>
          <div class="toggle-row"><span class="tl"><b>Dora</b><small>Dora, ura-dora and red fives together</small></span><${Stepper} label="dora" value=${d.riichi.dora || 0} min=${0} max=${20} onChange=${(v) => setRiichi({ dora: v })} /></div>
          ${res.det && res.det.fu ? html`<p class="hint">Fu from the tiles: <b class="num">${res.det.fu}</b></p>` : html`
            <div class="toggle-row"><span class="tl"><b>Closed hand</b><small>No chi, pon or open kan</small></span><${Switch} on=${d.riichi.closed !== false} onChange=${(v) => setRiichi({ closed: v })} label="Closed hand" /></div>
            <p class="flabel">Fu</p>
            <div class="chips fuchips">${[20, 25, 30, 40, 50, 60, 70, 80, 90, 100, 110].map((f) => html`<button type="button" class="chip" aria-pressed=${(+d.riichi.fu || 30) === f ? 'true' : 'false'} onClick=${() => setRiichi({ fu: f })}>${f}</button>`)}</div>
            <p class="hint">Seven pairs is always 25 fu and pinfu is 20 on a self-draw, whatever you pick.</p>`}
        </div>` : null}
        ${!R.valueEntry ? html`<div class="sec"><h3>Scoring</h3>
          ${rows.length ? html`<div class="receipt">${rows.map(({ p, n, fixed }) => {
            const lab = patLabel(R, p, selfDraw);
            const exBy = res.by[p.id];
            const auto = !fixed && (res.auto[p.id] || 0) > 0 && !(p.id in d.manual);
            const val = R.id === 'riichi' ? valueText(R, p, V, menzen) : V[p.id] === 'L' ? 'Limit' : (+V[p.id] || 0) * n;
            return html`<div class=${'rrow' + (exBy ? ' is-excl' : '')} key=${p.id}>
              <div class="rname"><span class="zh">${lab.zh}</span><span class="en">${lab.en}${n > 1 && p.max <= 1 ? ' ×' + n : ''}</span>
                ${exBy ? html`<span class="sub">Not counted with ${(R.patterns.find((x) => x.id === exBy) || {}).zh}</span>` : fixed ? html`<span class="sub">${fixed}</span>` : auto ? html`<span class="tag">from the tiles</span>` : null}
              </div>
              ${p.max > 1 && !fixed ? html`<${Stepper} label=${p.en} value=${n} min=${0} max=${p.max} onChange=${(v) => setCount(p.id, v)} />` : html`<span></span>`}
              <span style=${{ display: 'flex', alignItems: 'center', gap: '2px' }}><span class="rval">${val}</span>${fixed ? null : html`<button type="button" class="rx" aria-label=${'Remove ' + p.en} onClick=${() => setCount(p.id, 0)}>×</button>`}</span>
              ${explain && PATTERN_INFO[p.id] && PATTERN_INFO[p.id].d ? html`<div class="phelp"><p class="pdesc">${PATTERN_INFO[p.id].d}</p></div>` : null}
            </div>`;
          })}
          ${riichi && (d.riichi.dora || 0) > 0 && res.valid && !res.ym ? html`<div class="rrow"><div class="rname"><span class="zh">ドラ</span><span class="en">Dora</span></div><span></span><span class="rval">${d.riichi.dora} han</span></div>` : null}
          </div>` : html`<p class="hint">Nothing counted yet. ${d.tiles ? 'Finish the tiles or add patterns below.' : 'Add the patterns in this hand below.'}</p>`}
          ${Object.keys(d.manual).length ? html`<button type="button" class="link" style=${{ justifySelf: 'start' }} onClick=${() => up({ manual: {} })}>Undo my pattern changes</button>` : null}
          <details class="addlist" open=${!d.tiles}>
            <summary>Add a pattern</summary>
            <div class="addbody">
              <div class="toggle-row"><span class="tl"><b>Explain each pattern</b><small>Shows what it means under the example tiles</small></span><${Switch} on=${explain} onChange=${toggleExplain} label="Explain each pattern" /></div>
              ${R.patterns.length > 35 ? html`<input class="input" type="search" placeholder="Search patterns" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="Search patterns" />` : null}
              ${groupsOf(R).map((g) => {
                const list = addable.filter((p) => p.g === g && matches(p));
                if (!list.length) return null;
                return html`<div class="addgrp">${groupName(g)}</div>${list.map((p) => {
                  const lab = patLabel(R, p, selfDraw);
                  return html`<button type="button" class="addrow" key=${p.id} onClick=${() => setCount(p.id, 1)}><span class="plus" aria-hidden="true">+</span><span class="nm"><b>${lab.zh}</b><span>${lab.en}${p.note ? ' — ' + p.note : ''}</span></span><span class="v">${valueText(R, p, V, menzen)}</span><${PatternHelp} id=${p.id} showDesc=${explain} /></button>`;
                })}`;
              })}
            </div>
          </details>
        </div>` : null}
        ${R.id !== 'riichi' && R.id !== 'mcr' ? html`<div class="sec"><details><summary class="flabel" style=${{ cursor: 'pointer', minHeight: '32px' }}>One player pays for everyone (包)</summary>
          <p class="hint" style=${{ margin: '8px 0' }}>Use when a player is liable, for example they fed the tile that completed a limit hand.</p>
          <div class="chips">
            <button type="button" class="chip" aria-pressed=${d.liable == null ? 'true' : 'false'} onClick=${() => up({ liable: null })}>Nobody</button>
            ${[0, 1, 2, 3].filter((p) => p !== d.winner).map((p) => html`<button type="button" class="chip" aria-pressed=${d.liable === p ? 'true' : 'false'} onClick=${() => up({ liable: p })}>${pname(game, p)}</button>`)}
          </div></details></div>` : null}
      ` : html`
        <div class="sec">${riichi ? html`<h3>Who was tenpai?</h3>
          <${PlayerChips} game=${game} multi=${true} value=${d.draw.tenpai} onPick=${(p) => up((prev) => ({ draw: Object.assign({}, prev.draw, { tenpai: toggleIn(prev.draw.tenpai, p) }) }))} />
          <div class="toggle-row"><span class="tl"><b>Abortive draw</b><small>No tenpai payments; dealer stays</small></span><${Switch} on=${d.draw.abortive} onChange=${(v) => up((prev) => ({ draw: Object.assign({}, prev.draw, { abortive: v }) }))} label="Abortive draw" /></div>`
          : html`<p>No one won. Nothing is paid.</p><p class="hint">${R.id === 'mcr' ? 'The dealer passes to the next seat.' : R.id === 'tw' || game.settings.keepOnDraw ? 'The dealer stays for the next hand.' : 'The dealer passes to the next seat.'}</p>`}</div>`}
      ${viewPhoto && scan ? html`<div class="photo-view" role="dialog" aria-label="Photo" onClick=${() => setViewPhoto(false)}><img src=${scan.url} alt="Photo of the hand" /></div>` : null}
    <//>`;
  }

  /* ------------------------------------------------ payout / adjustment */
  function PayoutSheet({ game, onClose, onSaved }) {
    const R = RULES[game.ruleset];
    const [mode, setMode] = useState('each');
    const [who, setWho] = useState(null);
    const [other, setOther] = useState(null);
    const [amt, setAmt] = useState('');
    const [label, setLabel] = useState('');
    const a = Math.max(0, +amt || 0);
    const deltas = [0, 0, 0, 0];
    if (who != null && a > 0) {
      if (mode === 'each') [0, 1, 2, 3].forEach((p) => { if (p !== who) { deltas[p] -= a; deltas[who] += a; } });
      else if (mode === 'all') [0, 1, 2, 3].forEach((p) => { if (p !== who) { deltas[p] += a; deltas[who] -= a; } });
      else if (other != null && other !== who) { deltas[who] += a; deltas[other] -= a; }
    }
    const ok = deltas.some((x) => x !== 0);
    const unit = game.ruleset === 'riichi' ? 'points' : 'pts';
    function save() {
      if (!ok) return;
      const g = clone(game);
      const txt = label.trim() || (mode === 'each' ? pname(game, who) + ' collects ' + fmt(a) + ' from each' : mode === 'all' ? pname(game, who) + ' pays ' + fmt(a) + ' to each' : pname(game, other) + ' pays ' + pname(game, who));
      MJ.recordSide(g, deltas, txt);
      onSaved(g);
    }
    return html`<${Sheet} title="Payout or adjustment" sub="Kong money, bites, penalties, corrections" onClose=${onClose}
      foot=${html`<div class="sumrow"><div class="pays" style=${{ marginTop: 0 }}>${ok ? deltas.map((x, p) => html`<span class=${cls(x)}><small>${pname(game, p)}</small>${signed(x)}</span>`) : html`<span class="muted">Pick a player and an amount</span>`}</div><button type="button" class="btn primary" disabled=${!ok} onClick=${save}>Save</button></div>`}>
      ${R.instant ? html`<div class="sec"><h3>Instant payouts</h3><div class="chips">${R.instant.map((x) => html`<button type="button" class="chip" onClick=${() => { setMode('each'); setAmt(String(x.each)); setLabel(x.en + (x.zh ? ' ' + x.zh : '')); }}>${x.zh ? html`<span class="cw">${x.zh}</span>` : null}${x.en} · ${x.each}</button>`)}</div><p class="hint">Each other player pays the winner of the bonus. Amounts are editable below.</p></div>` : null}
      <div class="sec"><h3>Type</h3>
        <${Seg} label="Payment type" value=${mode} onChange=${setMode} options=${[['each', 'Everyone pays one'], ['all', 'One pays everyone'], ['one', 'One pays one']]} />
      </div>
      <div class="sec"><h3>${mode === 'each' ? 'Who collects' : mode === 'all' ? 'Who pays' : 'Who receives'}</h3>
        <${PlayerChips} game=${game} value=${who} onPick=${setWho} />
        ${mode === 'one' ? html`<p class="flabel">Who pays</p><${PlayerChips} game=${game} value=${other} exclude=${who} onPick=${setOther} />` : null}
      </div>
      <div class="sec">
        <div class="field"><label for="pa">Amount ${mode === 'one' ? '' : 'per player'} (${unit})</label><input id="pa" class="input num" inputmode="decimal" value=${amt} onInput=${(e) => setAmt(e.target.value)} placeholder="e.g. 2" /></div>
        <div class="field"><label for="pl">Note (optional)</label><input id="pl" class="input" value=${label} onInput=${(e) => setLabel(e.target.value.slice(0, 60))} placeholder="e.g. 詐糊 false win" /></div>
      </div>
    <//>`;
  }

  /* ------------------------------------------------ settings controls */
  function SettingControl({ s, value, onChange }) {
    if (s.type === 'bool') return html`<div class="toggle-row"><span class="tl"><b>${s.label}</b></span><${Switch} on=${!!value} onChange=${onChange} label=${s.label} /></div>`;
    if (s.type === 'select') return html`<div class="field"><label for=${'s-' + s.key}>${s.label}</label><select id=${'s-' + s.key} class="select" value=${value} onChange=${(e) => onChange(e.target.value)}>${s.options.map(([v, t]) => html`<option value=${v}>${t}</option>`)}</select></div>`;
    const step = s.step || 1;
    const big = s.max > 100;
    return html`<div class="toggle-row"><span class="tl"><b>${s.label}${s.zh ? html` <span class="k muted">${s.zh}</span>` : null}</b></span>
      ${big ? html`<input id=${'s-' + s.key} class="input num" style=${{ width: '130px' }} inputmode="numeric" value=${value} onInput=${(e) => { const v = parseInt(e.target.value.replace(/[^0-9]/g, ''), 10); onChange(isNaN(v) ? s.min : Math.min(s.max, v)); }} aria-label=${s.label} />`
        : html`<${Stepper} label=${s.label} value=${+value} min=${s.min} max=${s.max} step=${step} onChange=${onChange} />`}
    </div>`;
  }

  /* ------------------------------------------------ setup */
  function Setup({ onCancel, onCreate }) {
    const [rs, setRs] = useState('hk');
    const [names, setNames] = useState(['', '', '', '']);
    const [settings, setSettings] = useState({});
    const [per, setPer] = useState('');
    const [sym, setSym] = useState('Rp');
    const R = RULES[rs];
    const S = Object.assign({}, MJ.newGame({ ruleset: rs, players: [{}, {}, {}, {}] }).settings, settings);
    function create() {
      const g = MJ.newGame({ ruleset: rs, players: names.map((n, i) => ({ name: n.trim() || 'Player ' + (i + 1) })), settings: S, money: { per: +per || 0, symbol: sym.trim() } });
      onCreate(g);
    }
    return html`<div class="topbar"><div class="topbar-in"><button type="button" class="backbtn" onClick=${onCancel}>${I.back}Back</button><div class="ttl"><b>New game</b></div><span style=${{ width: '64px' }}></span></div></div>
      <main class="wrap">
        <div class="sec"><h3>Rules</h3>
          <div class="rgrid">${MJ.ORDER.map((id) => { const r = RULES[id]; return html`<button type="button" class="rcard" aria-pressed=${rs === id ? 'true' : 'false'} onClick=${() => { setRs(id); setSettings({}); }}><b>${r.name}</b><span class="kn">${r.native}</span><span>${r.blurb}</span></button>`; })}</div>
        </div>
        <div class="sec"><h3>Players</h3>
          <p class="hint">Enter them in turn order, starting with the first dealer. Seats stay fixed; the dealer marker moves.</p>
          <div class="pgrid">${[0, 1, 2, 3].map((i) => html`<div class="prow"><${Tile} code=${(i + 1) + 'z'} size="sm" label=${MJ.WINDS[i] + ' seat'} /><input id=${'pn' + i} class="input" value=${names[i]} placeholder=${i === 0 ? 'First dealer' : 'Player ' + (i + 1)} maxlength="24" onInput=${(e) => { const n = names.slice(); n[i] = e.target.value; setNames(n); }} aria-label=${'Player ' + (i + 1) + ' name'} /></div>`)}</div>
        </div>
        <div class="sec"><h3>${R.name} settings</h3>
          <div class="settings">${R.settings.map((s) => html`<${SettingControl} s=${s} value=${S[s.key]} onChange=${(v) => setSettings(Object.assign({}, settings, { [s.key]: v }))} />`)}</div>
          ${R.id === 'hk' || R.id === 'sg' || R.id === 'tw' ? html`<p class="hint">Pattern values can be changed per game from the game menu.</p>` : null}
        </div>
        <div class="sec"><h3>Stakes (optional)</h3>
          <div class="row" style=${{ alignItems: 'end' }}>
            <div class="field" style=${{ flex: '0 0 96px' }}><label for="sym">Currency</label><input id="sym" class="input" value=${sym} maxlength="4" onInput=${(e) => setSym(e.target.value)} /></div>
            <div class="field" style=${{ flex: '1 1 160px' }}><label for="per">${rs === 'riichi' ? 'Money per 1,000 points' : 'Money per point'}</label><input id="per" class="input num" inputmode="decimal" value=${per} placeholder="Optional" onInput=${(e) => setPer(e.target.value)} /></div>
          </div>
        </div>
        <div class="sec"><button type="button" class="btn primary big block" onClick=${create}>Start game</button></div>
      </main>`;
  }

  /* ------------------------------------------------ rules & values */
  function RulesSheet({ game, onClose, onSaved }) {
    const R = RULES[game.ruleset];
    const [S, setS] = useState(Object.assign({}, game.settings));
    const [vals, setVals] = useState(Object.assign({}, game.values || {}));
    const V = Object.assign({}, MJ.valuesOf(Object.assign({}, game, { values: {} })), R.fixedValues ? {} : vals);
    function save() { const g = clone(game); g.settings = S; g.values = vals; onSaved(g); }
    return html`<${Sheet} tall=${true} title="Rules and values" sub=${R.name + ' · changes apply to new hands'} onClose=${onClose}
      foot=${html`<div class="row" style=${{ justifyContent: 'flex-end' }}><button type="button" class="btn" onClick=${onClose}>Cancel</button><button type="button" class="btn primary" onClick=${save}>Save rules</button></div>`}>
      <div class="sec"><h3>Settings</h3><div class="settings">${R.settings.map((s) => html`<${SettingControl} s=${s} value=${S[s.key]} onChange=${(v) => setS(Object.assign({}, S, { [s.key]: v }))} />`)}</div></div>
      ${R.patterns.length ? html`<div class="sec"><h3>${R.fixedValues ? 'Values' : 'Values (edit to match your table)'}</h3>
        <div class="vtable">${groupsOf(R).map((gk) => html`<div class="addgrp">${groupName(gk)}</div>${R.patterns.filter((p) => p.g === gk).map((p) => {
          const cur = V[p.id];
          const control = R.fixedValues ? html`<span class="num" style=${{ textAlign: 'right' }}>${valueText(R, p, V, true)}</span>`
            : p.v === 'L' || cur === 'L' ? html`<select class="select" value=${cur === 'L' ? 'L' : String(cur)} onChange=${(e) => setVals(Object.assign({}, vals, { [p.id]: e.target.value === 'L' ? 'L' : +e.target.value }))} aria-label=${p.en}>${['L'].concat(Array.from({ length: 14 }, (_, i) => String(i))).map((o) => html`<option value=${o}>${o === 'L' ? 'Limit' : o}</option>`)}</select>`
            : html`<input class="input num" inputmode="numeric" value=${cur} aria-label=${p.en} onInput=${(e) => { const v = parseInt(e.target.value, 10); setVals(Object.assign({}, vals, { [p.id]: isNaN(v) ? 0 : Math.max(0, Math.min(99, v)) })); }} />`;
          return html`<div class="vrow"><span class="nm"><b>${p.zh}</b><span>${p.en}${p.note ? ' — ' + p.note : ''}</span></span>${control}</div>`;
        })}`)}</div>
        ${!R.fixedValues ? html`<button type="button" class="link" onClick=${() => setVals({})}>Reset values to defaults</button>` : null}
      </div>` : null}
    <//>`;
  }

  /* ------------------------------------------------ names */
  function NamesSheet({ game, onClose, onSaved }) {
    const [names, setNames] = useState(game.players.map((p) => p.name));
    return html`<${Sheet} title="Player names" onClose=${onClose} foot=${html`<div class="row" style=${{ justifyContent: 'flex-end' }}><button type="button" class="btn" onClick=${onClose}>Cancel</button><button type="button" class="btn primary" onClick=${() => { const g = clone(game); g.players = names.map((n, i) => ({ name: n.trim() || 'Player ' + (i + 1) })); onSaved(g); }}>Save</button></div>`}>
      <div class="sec pgrid">${names.map((n, i) => html`<div class="prow"><span class="k muted" style=${{ width: '24px', textAlign: 'center' }}>${i + 1}</span><input class="input" value=${n} maxlength="24" aria-label=${'Player ' + (i + 1)} onInput=${(e) => { const x = names.slice(); x[i] = e.target.value; setNames(x); }} /></div>`)}</div>
    <//>`;
  }

  /* ------------------------------------------------ standings & export */
  function csvOf(game) {
    const R = RULES[game.ruleset];
    const esc = (s) => { s = String(s == null ? '' : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ['#', 'Round', 'Result', 'Winner', 'How', 'Discarder', 'Value', 'Patterns'].concat(game.players.map((p, i) => pname(game, i)));
    const lines = [head.map(esc).join(',')];
    let n = 0;
    for (const e of game.entries) {
      if (e.kind === 'side') { lines.push([''].concat(['', 'Payout', '', '', '', '', e.label]).concat(e.deltas).map(esc).join(',')); continue; }
      n++;
      lines.push([n, MJ.roundLabel(game, e.before), e.outcome, e.winner != null ? pname(game, e.winner) : '', e.how || '', e.discarder != null ? pname(game, e.discarder) : '', e.outcome === 'win' ? e.text : '', (e.patterns || []).join(' + ')].concat(e.deltas).map(esc).join(','));
    }
    lines.push(['', '', 'Total', '', '', '', '', ''].concat(MJ.totals(game)).map(esc).join(','));
    return lines.join('\n');
  }
  function summaryText(game) {
    const R = RULES[game.ruleset];
    const rows = MJ.standings(game);
    const d = new Date(game.createdAt);
    const out = ['Mahjong · ' + R.name + ' rules · ' + d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })];
    rows.forEach((r, i) => {
      const riichi = game.ruleset === 'riichi';
      const main = riichi ? fmt(r.points) + ' (' + (r.final > 0 ? '+' : '') + r.final + ')' : signed(r.points);
      const m = riichi ? moneyFor(game, (r.final || 0) * 1000) : moneyFor(game, r.points);
      out.push((i + 1) + '. ' + pname(game, r.p) + '  ' + main + (m ? '  ' + m : ''));
    });
    out.push(game.entries.filter((e) => e.kind === 'hand').length + ' hands');
    return out.join('\n');
  }
  function moneyText(game, v) {
    const m = game.money || {};
    return (m.symbol ? m.symbol + ' ' : '') + fmt(Math.abs(v));
  }
  function EndSheet({ game, onClose, onSaved, onToast }) {
    const rows = MJ.standings(game);
    const riichi = game.ruleset === 'riichi';
    const [copyText, setCopyText] = useState(null);
    const share = canShareFiles();
    async function copy() {
      const t = summaryText(game);
      try { await navigator.clipboard.writeText(t); onToast('Summary copied'); }
      catch (e) { setCopyText(t); }
    }
    async function exportFile(name, data, type) {
      try {
        if (share) { await shareText(name, data, type); return; }
        downloadText(name, data, type); onToast('Download started');
      } catch (e) { if (!(e && e.name === 'AbortError')) { try { downloadText(name, data, type); onToast('Download started'); } catch (e2) { onToast('That export didn’t work here'); } } }
    }
    const stamp = new Date(game.createdAt).toISOString().slice(0, 10);
    const hasMoney = +(game.money && game.money.per) > 0;
    const nets = hasMoney ? MJ.moneyNets(game) : (riichi ? rows.reduce((a, r) => { a[r.p] = (r.final || 0) * 1000; return a; }, [0, 0, 0, 0]) : MJ.totals(game));
    const transfers = MJ.settle(nets);
    const amountText = (v) => hasMoney ? moneyText(game, v) : riichi ? fmt(v / 1000) : fmt(v) + ' pts';
    return html`<${Sheet} title="Standings" sub=${RULES[game.ruleset].name + (game.finished ? ' · finished' : ' · in progress')} onClose=${onClose}
      foot=${html`<div class="row" style=${{ justifyContent: 'space-between' }}>
        <button type="button" class="btn" onClick=${() => { const g = clone(game); g.finished = !g.finished; onSaved(g); }}>${game.finished ? 'Reopen game' : 'Finish game'}</button>
        <button type="button" class="btn primary" onClick=${copy}>Copy summary</button></div>`}>
      <div class="sec stand">${rows.map((r, i) => html`<div class="srow"><span class="srank">${i + 1}</span><span class="snm">${pname(game, r.p)}</span>
        <span class="sval">${riichi ? html`${(r.final > 0 ? '+' : '') + r.final}<small>${fmt(r.points)} pts</small>` : html`<span class=${cls(r.points)}>${signed(r.points)}</span>`}
        ${riichi ? (moneyFor(game, (r.final || 0) * 1000) ? html`<small>${moneyFor(game, (r.final || 0) * 1000)}</small>` : null) : moneyFor(game, r.points) ? html`<small>${moneyFor(game, r.points)}</small>` : null}</span></div>`)}
      ${riichi ? html`<p class="hint" style=${{ marginTop: '10px' }}>Final = (points − ${fmt(game.settings.returnPoints)}) ÷ 1,000 + uma, with the oka and any sticks left on the table to first place.</p>` : null}</div>
      <div class="sec"><h3>Settle up</h3>
        ${transfers.length ? html`<div class="settle">${transfers.map((t, k) => html`<div class="trow" key=${k}><span class="tw">${pname(game, t.from)}<em>pays</em>${pname(game, t.to)}</span><span class="ta">${amountText(t.amount)}</span></div>`)}</div>
          <p class="hint">${hasMoney ? 'The fewest transfers that settle everyone at ' + moneyText(game, game.money.per) + (riichi ? ' per 1,000 points.' : ' per point.') : 'No stakes were set for this game, so this is in ' + (riichi ? 'final score units.' : 'points.') + ' Set money per point under Rules and values.'}</p>`
        : html`<p class="hint">Nobody owes anything yet.</p>`}
      </div>
      ${copyText ? html`<div class="sec"><p class="hint">Copying isn’t allowed here. Select the text and copy it yourself.</p><textarea class="copybox" readonly value=${copyText} onFocus=${(e) => e.target.select()}></textarea></div>` : null}
      <div class="sec"><h3>Export</h3><div class="row">
        <button type="button" class="btn primary" onClick=${() => saveRecap(game, onToast).catch(() => onToast('Could not make the recap image'))}>Save recap image</button>
        <button type="button" class="btn" onClick=${() => exportFile('mahjong-' + stamp + '.csv', csvOf(game), 'text/csv')}>Hands as CSV</button>
        <button type="button" class="btn" onClick=${() => exportFile('mahjong-' + stamp + '.json', JSON.stringify(game, null, 1), 'application/json')}>Full backup (JSON)</button>
      </div><p class="hint">The recap image has the standings, who pays whom and every hand — keep it, because accounts unused for ${Store.inactiveDays} days are deleted. ${share ? 'Files open the share sheet, so you can save them or send them to a friend.' : 'Files download to this device.'} A JSON backup can be imported again from the home screen.</p></div>
    <//>`;
  }

  /* ------------------------------------------------ game view */
  function GameView({ game, onBack, commit, onDelete, onNewGame, toast, onSignIn }) {
    const [sheet, setSheet] = useState(null);
    const R = RULES[game.ruleset];
    const done = MJ.gameComplete(game);
    const last = game.entries[game.entries.length - 1];
    const close = () => setSheet(null);
    const saved = (g, msg) => { commit(g); setSheet(null); if (msg) toast(msg); };
    function undoLast() {
      const g = clone(game); MJ.undo(g); commit(g); setSheet(null); toast('Removed the last entry');
    }
    return html`
      <div class="topbar"><div class="topbar-in">
        <button type="button" class="backbtn" onClick=${onBack}>${I.back}Games</button>
        <div class="ttl"><b>${game.example ? 'Example game' : R.name}</b><span>${game.example ? R.name + ' rules · not saved' : MJ.roundLabel(game)}</span></div>
        <button type="button" class="iconbtn" aria-label="Game menu" onClick=${() => setSheet('menu')}>${I.more}</button>
      </div></div>
      <main class="wrap">
        ${game.example ? html`<div class="banner"><p>This is an example so you can see how it works. Hands you record here aren’t saved.</p><button type="button" class="btn small primary" onClick=${onNewGame}>Start a real game</button></div>` : null}
        <div style=${{ marginTop: '14px' }}><${TableHero} game=${game} /></div>
        ${done && !game.finished ? html`<div class="banner gold"><p>The last round is complete. Keep playing or see the final standings.</p><button type="button" class="btn small" onClick=${() => setSheet('end')}>Standings</button></div>` : null}
        <${Ledger} game=${game} />
        ${last ? html`<div class="row" style=${{ marginTop: '12px' }}><button type="button" class="btn small" onClick=${() => setSheet('undo')}>${I.undo}Undo last entry</button></div>` : null}
      </main>
      <div class="dock"><div class="dock-in">
        <button type="button" class="btn primary big" onClick=${() => setSheet('record')} disabled=${game.finished}>${I.plus}Record hand</button>
        <button type="button" class="btn big" onClick=${() => setSheet('payout')} disabled=${game.finished} aria-label="Payout or adjustment">${I.coins}</button>
      </div></div>
      ${sheet === 'record' ? html`<${RecordSheet} game=${game} onClose=${close} onSaved=${(g) => saved(g, 'Hand saved')} onSignIn=${onSignIn} />` : null}
      ${sheet === 'payout' ? html`<${PayoutSheet} game=${game} onClose=${close} onSaved=${(g) => saved(g, 'Payout saved')} />` : null}
      ${sheet === 'rules' ? html`<${RulesSheet} game=${game} onClose=${close} onSaved=${(g) => saved(g, 'Rules updated')} />` : null}
      ${sheet === 'names' ? html`<${NamesSheet} game=${game} onClose=${close} onSaved=${(g) => saved(g, 'Names updated')} />` : null}
      ${sheet === 'end' ? html`<${EndSheet} game=${game} onClose=${close} onSaved=${(g) => saved(g)} onToast=${toast} />` : null}
      ${sheet === 'undo' && last ? html`<${Confirm} title="Undo last entry?" body=${'This removes ' + (last.kind === 'side' ? 'the payout “' + last.label + '”' : last.outcome === 'draw' ? 'the draw' : pname(game, last.winner) + '’s ' + last.text.split(' · ')[0] + ' hand') + ' and puts the scores and dealer back.'} action="Undo" onYes=${undoLast} onNo=${close} />` : null}
      ${sheet === 'delete' ? html`<${Confirm} title="Delete this game?" body="The game and every hand in it will be deleted. This can’t be undone." action="Delete game" danger=${true} onYes=${onDelete} onNo=${close} />` : null}
      ${sheet === 'menu' ? html`<${Sheet} title="Game" sub=${R.name} onClose=${close}><div class="menu">
        <button type="button" onClick=${() => setSheet('end')}>${I.flag}<span>Standings and export<small>Final scores, copy for chat, CSV</small></span></button>
        <button type="button" onClick=${() => setSheet('rules')}>${I.rules}<span>Rules and values<small>Minimums, limits, payouts, pattern values</small></span></button>
        <button type="button" onClick=${() => setSheet('payout')}>${I.coins}<span>Payout or adjustment<small>Kong money, animal bites, penalties</small></span></button>
        <button type="button" onClick=${() => setSheet('names')}>${I.people}<span>Player names</span></button>
        ${game.example ? null : html`<button type="button" class="danger" onClick=${() => setSheet('delete')}>${I.trash}<span>Delete game</span></button>`}
      </div><//>` : null}`;
  }

  /* ------------------------------------------------ home */
  function GameCard({ game, onOpen }) {
    const R = RULES[game.ruleset];
    const t = MJ.totals(game);
    const riichi = game.ruleset === 'riichi';
    const hands = game.entries.filter((e) => e.kind === 'hand').length;
    return html`<button type="button" class="gcard" onClick=${onOpen}>
      <span class="gtop"><span class="gname">${R.name} <span class="k muted">${R.native}</span></span><span class="gmeta">${ago(game.updatedAt)}</span></span>
      <span class="gscores">${[0, 1, 2, 3].map((p) => html`<div><span>${pname(game, p)}</span><b class=${riichi ? '' : cls(t[p])}>${riichi ? fmt(t[p]) : signed(t[p])}</b></div>`)}</span>
      <span class="gmeta">${hands} hand${hands === 1 ? '' : 's'} · ${game.finished ? 'finished' : MJ.roundLabel(game)}</span>
    </button>`;
  }
  function Home({ onNew, onOpen, example, onSignIn, onAccount, onToast }) {
    const games = Store.list();
    const active = games.filter((g) => !g.finished), done = games.filter((g) => g.finished);
    const line = storeLine();
    const impRef = useRef(null);
    const onImport = (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value = '';
      if (f) importGamesFromFile(f, (n) => onToast(n < 0 ? 'That file isn’t a scorebook backup' : n ? 'Imported ' + n + ' game' + (n > 1 ? 's' : '') : 'Nothing new to import'));
    };
    return html`<main class="wrap">
      <header class="hero">
        <div class="brand"><span class="seal" aria-hidden="true">麻雀</span><h1>${BRAND}${LITE && IS_DEFAULT_BRAND ? html` <span class="k muted" style=${{ fontSize: '18px', fontFamily: 'var(--f-ui)' }}>Lite</span>` : null}</h1></div>
        <p class="lede">Record who won, how, and with what. Tap the winning tiles on the board and it works out the patterns, the faan, tai or han, splits the payments and keeps the running score.${LITE ? '' : ' Or snap the winning hand and it reads the tiles for you.'}</p>
        <div class="rules-strip">${MJ.ORDER.map((id) => html`<span>${RULES[id].name}<b>${RULES[id].native.replace('麻雀', '').replace('麻将', '').replace('麻將', '') || RULES[id].native}</b></span>`)}</div>
        <div class="row">
          <button type="button" class="btn primary big" onClick=${onNew}>${I.plus}New game</button>
          ${Store.user ? html`<button type="button" class="btn big" onClick=${onAccount}>${I.people}${displayName(Store.user)}</button>` : html`<button type="button" class="btn big" onClick=${onSignIn}>${I.people}Sign in</button>`}
        </div>
      </header>
      ${active.length ? html`<div class="section-head"><h2>In progress</h2></div><div class="stack">${active.map((g) => html`<${GameCard} key=${g.id} game=${g} onOpen=${() => onOpen(g.id)} />`)}</div>` : null}
      ${!active.length ? html`<div class="section-head"><h2>See it in action</h2><span class="example-note">Example · not saved</span></div>
        <div class="stack"><${TableHero} game=${example} compact=${true} />
        <button type="button" class="btn" onClick=${() => onOpen('example')}>Open the example game</button></div>` : null}
      ${done.length ? html`<div class="section-head"><h2>Finished</h2></div><div class="stack">${done.map((g) => html`<${GameCard} key=${g.id} game=${g} onOpen=${() => onOpen(g.id)} />`)}</div>` : null}
      <p class="store-note"><span class=${'dot ' + line.dot}></span>${Store.ready ? line.text : 'Checking where games are saved…'}</p>
      <p class="acct"><button type="button" class="link" onClick=${() => impRef.current && impRef.current.click()}>Import a backup (JSON)</button><input ref=${impRef} type="file" accept=".json,application/json" class="hidden-input" tabindex="-1" onChange=${onImport} />${window.BUILD ? html`<span>· build ${window.BUILD}</span>` : null}</p>
    </main>`;
  }

  /* ------------------------------------------------ sign in & account */
  function SignInSheet({ onClose, onDone, initialMode }) {
    const [name, setName] = useState(lsGet('mjsb.name') || '');
    const [pin, setPin] = useState('');
    const [mode, setMode] = useState(initialMode || 'signin'); // signin | create | guest
    const [guestCode, setGuestCode] = useState('');
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');
    const create = mode === 'create';
    const ok = name.trim().length >= 2 && /^[^\s]{4,32}$/.test(pin);
    async function go() {
      if (!ok || busy) return;
      setBusy(true); setErr('');
      try {
        await Store.signIn(name.trim(), pin, create);
        lsSet('mjsb.name', name.trim());
        onDone();
      } catch (e) {
        if (e.code === 'no_such_user') { setMode('create'); setErr('No account has that name yet. Tap “Create account” to start one with this name and password.'); }
        else if (e.code === 'name_taken') { setMode('signin'); setErr('That name already has an account. Enter its password to sign in.'); }
        else setErr(e.message || 'Could not sign in.');
      }
      setBusy(false);
    }
    async function guestNew() {
      if (busy) return;
      setBusy(true); setErr('');
      try { const id = await Store.guestStart(); onDone('Your guest id is ' + id.replace(/^guest-/, '') + ' — share it with your table'); }
      catch (e) { setErr(e.message || 'Could not start as a guest.'); }
      setBusy(false);
    }
    async function guestJoin() {
      const code = 'guest-' + guestCode.trim().toUpperCase().replace(/^GUEST-/, '');
      if (!/^guest-[A-Z2-9]{6}$/.test(code) || busy) { setErr('A guest id is 6 letters or numbers, like K7M2XQ.'); return; }
      setBusy(true); setErr('');
      try { await Store.signIn(code, code, false); onDone(); }
      catch (e) { setErr(e.code === 'no_such_user' ? 'No table has that guest id (ids expire after ' + Store.inactiveDays + ' days without use).' : (e.message || 'Could not join.')); }
      setBusy(false);
    }
    const guide = html`<div class="guide">
      <p><b>Same scorebook for the whole table:</b> everyone who signs in with the same name and password (or the same guest id) sees and edits the same games. Other tables can’t see yours.</p>
      <p><b>Kept for ${Store.inactiveDays} days:</b> an account that isn’t used for ${Store.inactiveDays} days is deleted with its games. Save the <b>recap image</b> (Standings → Save recap image) to keep a match for good.</p>
    </div>`;
    if (mode === 'guest') return html`<${Sheet} title="Play as a guest" sub="No account needed" onClose=${onClose}
      foot=${html`<div class="row" style=${{ justifyContent: 'space-between' }}><button type="button" class="link" onClick=${() => { setMode('signin'); setErr(''); }}>Use an account instead</button><button type="button" class="btn primary" disabled=${busy} onClick=${guestNew}>${busy ? 'One moment…' : 'New guest table'}</button></div>`}>
      <div class="sec">
        <p>A guest table gets a <b>6-character guest id</b>. Share it with the people at your table: anyone who enters it sees and edits the same scorebook.</p>
        <div class="field"><label for="gj">Have a guest id already? Enter it to join</label><div class="row"><input id="gj" class="input num pinbox" style=${{ flex: '1 1 160px', textTransform: 'uppercase' }} maxlength="12" autocapitalize="characters" value=${guestCode} onInput=${(e) => setGuestCode(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') guestJoin(); }} placeholder="e.g. K7M2XQ" /><button type="button" class="btn" disabled=${busy} onClick=${guestJoin}>Join</button></div></div>
        ${err ? html`<p class="err">${err}</p>` : null}
      </div>
      <div class="sec">${guide}</div>
    <//>`;
    return html`<${Sheet} title=${create ? 'Create account' : 'Sign in'} sub=${create ? 'Pick a name and password for your table' : 'The name and password you created'} onClose=${onClose}
      foot=${html`<div class="row" style=${{ justifyContent: 'space-between' }}>
        <button type="button" class="link" onClick=${() => { setMode(create ? 'signin' : 'create'); setErr(''); }}>${create ? 'I already have an account' : 'Create a new account'}</button>
        <button type="button" class="btn primary" disabled=${!ok || busy} onClick=${go}>${busy ? 'One moment…' : create ? 'Create account' : 'Sign in'}</button></div>`}>
      <div class="sec">
        <div class="field"><label for="si-name">Name (your table or group)</label><input id="si-name" class="input" value=${name} maxlength="24" autocomplete="username" onInput=${(e) => setName(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') go(); }} placeholder="e.g. Table 3 or James" /></div>
        <div class="field"><label for="si-pin">Password (4 to 32 characters)</label><input id="si-pin" class="input" type="password" maxlength="32" autocomplete=${create ? 'new-password' : 'current-password'} value=${pin} onInput=${(e) => setPin(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') go(); }} /></div>
        ${err ? html`<p class="err">${err}</p>` : null}
        ${create ? html`<p class="hint">There is no password reset, so note it somewhere safe. Give the same name and password to everyone at your table.</p>` : null}
        <button type="button" class="link" style=${{ justifySelf: 'start' }} onClick=${() => { setMode('guest'); setErr(''); }}>Or continue as a guest</button>
      </div>
      <div class="sec">${guide}</div>
    <//>`;
  }
  function AccountSheet({ onClose, onToast }) {
    const [mode, setMode] = useState('info');
    const [pin, setPin] = useState(''), [pin2, setPin2] = useState('');
    const [busy, setBusy] = useState(false), [err, setErr] = useState('');
    const u = Store.user;
    async function changePin() {
      if (!/^[^\s]{4,32}$/.test(pin) || !/^[^\s]{4,32}$/.test(pin2) || busy) return;
      setBusy(true); setErr('');
      try { await API.call('changePin', { pin, newPin: pin2 }); onToast('Password changed'); setMode('info'); setPin(''); setPin2(''); }
      catch (e) { setErr(e.message || 'Could not change the password.'); }
      setBusy(false);
    }
    async function signOut() { setBusy(true); await Store.signOut(); setBusy(false); onToast('Signed out'); onClose(); }
    async function copyId() {
      const id = u.name.replace(/^guest-/, '');
      try { await navigator.clipboard.writeText(id); onToast('Guest id copied'); } catch (e) { onToast('Guest id: ' + id); }
    }
    if (!u) return null;
    const guest = isGuest(u);
    const days = Store.expiresAt ? Math.max(0, Math.ceil((Store.expiresAt - Date.now()) / 86400000)) : Store.inactiveDays;
    return html`<${Sheet} title="Account" sub=${displayName(u)} onClose=${onClose}>
      ${mode === 'info' ? html`
        <div class="sec">
          ${guest ? html`<div class="guestbox"><span class="eyebrow">Your guest id</span><b class="num">${u.name.replace(/^guest-/, '')}</b><button type="button" class="btn small" onClick=${copyId}>Copy</button></div>
            <p class="hint">Give this id to everyone at your table. On their phone: Play as a guest → enter the id → Join. They then see and edit the same games as you.</p>`
          : html`<p class="hint">Everyone who signs in with <b>${u.name}</b> and the same password sees and edits the same games. Other tables can’t see yours.</p>`}
          ${Store.scans && !LITE ? html`<p class="acct">${Store.scans.today} of ${Store.scans.limit} photo reads used today</p>` : null}
          <p class="warn">This ${guest ? 'guest table' : 'account'} is kept for ${Store.inactiveDays} days after its last use (about ${days} day${days === 1 ? '' : 's'} from now unless someone opens it again). After that it is deleted with all its games. Save each match as a <b>recap image</b> from Standings to keep it.</p>
        </div>
        <div class="menu">
          ${guest ? null : html`<button type="button" onClick=${() => setMode('pin')}>${I.rules}<span>Change password</span></button>`}
          <button type="button" onClick=${() => setMode('out')}>${I.people}<span>Sign out<small>${guest ? 'Keep the guest id if you want to come back' : 'Your games stay in the account'}</small></span></button>
        </div>` : null}
      ${mode === 'pin' ? html`<div class="sec">
          <div class="field"><label for="cp-old">Current password</label><input id="cp-old" class="input" type="password" maxlength="32" value=${pin} onInput=${(e) => setPin(e.target.value)} /></div>
          <div class="field"><label for="cp-new">New password (4 to 32 characters)</label><input id="cp-new" class="input" type="password" maxlength="32" value=${pin2} onInput=${(e) => setPin2(e.target.value)} /></div>
          ${err ? html`<p class="err">${err}</p>` : null}
          <div class="row" style=${{ justifyContent: 'flex-end' }}><button type="button" class="btn" onClick=${() => setMode('info')}>Cancel</button><button type="button" class="btn primary" disabled=${busy} onClick=${changePin}>Save password</button></div>
        </div>` : null}
      ${mode === 'out' ? html`<div class="sec">
          <p>Sign out of <b>${displayName(u)}</b> on this device?</p>
          <p class="hint">${guest ? 'Write down the guest id first — it is the only way back into this table.' : 'Games saved to the account are removed from this device and come back when you sign in again.'}</p>
          <div class="row" style=${{ justifyContent: 'flex-end' }}><button type="button" class="btn" onClick=${() => setMode('info')}>Cancel</button><button type="button" class="btn danger" disabled=${busy} onClick=${signOut}>Sign out</button></div>
        </div>` : null}
    <//>`;
  }

  /* ------------------------------------------------ welcome (before sign-in) */
  function Welcome({ onPick }) {
    return html`<main class="wrap">
      <header class="hero">
        <div class="brand"><span class="seal" aria-hidden="true">麻雀</span><h1>${BRAND}</h1></div>
        <p class="lede">Keeps the score for your mahjong table. Pick the rules, tap the winning tiles on a board, and it works out the patterns, the points and who pays whom.</p>
        <div class="rules-strip">${MJ.ORDER.map((id) => html`<span>${RULES[id].name}<b>${RULES[id].native.replace('麻雀', '').replace('麻将', '').replace('麻將', '') || RULES[id].native}</b></span>`)}</div>
      </header>
      <div class="welcome-actions">
        <button type="button" class="btn primary big block" onClick=${() => onPick('create')}>${I.plus}Create an account for your table</button>
        <button type="button" class="btn big block" onClick=${() => onPick('signin')}>Sign in</button>
        <button type="button" class="btn big block" onClick=${() => onPick('guest')}>Continue as a guest</button>
      </div>
      <div class="guide" style=${{ marginTop: '22px' }}>
        <p class="eyebrow">How it works</p>
        <p><b>One scorebook per table.</b> Sign in with the same name and password on every phone at your table — or share a guest id — and everyone sees and edits the same games. Other tables can’t see yours.</p>
        <p><b>Kept for ${Store.inactiveDays} days.</b> An account or guest table that isn’t used for ${Store.inactiveDays} days is deleted with its games, so at the end of a match save the <b>recap image</b> (Standings → Save recap image): it has the final scores, who pays whom and every hand.</p>
        <p><b>Install it:</b> Share → Add to Home Screen puts ${BRAND} on your phone like an app.</p>
      </div>
      ${Store.error ? html`<p class="store-note"><span class="dot bad"></span>${Store.error}</p>` : null}
      ${window.BUILD ? html`<p class="acct">build ${window.BUILD}</p>` : null}
    </main>`;
  }

  /* ------------------------------------------------ app */
  function App() {
    const [, force] = useState(0);
    useEffect(() => Store.sub(() => force((x) => x + 1)), []);
    const [view, setView] = useState('home');
    const [gid, setGid] = useState(null);
    const [example, setExample] = useState(exampleGame);
    const [toastMsg, setToastMsg] = useState(null);
    const [modal, setModal] = useState(null);
    const [update, setUpdate] = useState(false);
    const restored = useRef(false);
    useEffect(() => {
      if (restored.current || !Store.ready) return;
      restored.current = true;
      const last = lsGet('mjsb.last');
      const g = last && Store.get(last);
      if (g && !g.finished && view === 'home') { setGid(last); setView('game'); }
    });
    useEffect(() => { if (!toastMsg) return; const t = setTimeout(() => setToastMsg(null), 2600); return () => clearTimeout(t); }, [toastMsg]);
    useEffect(() => { window.scrollTo(0, 0); }, [view, gid]);
    useEffect(() => { if (Store.note) { setToastMsg(Store.note); Store.note = ''; } });
    useEffect(() => { window.addEventListener('mjsb-update', () => setUpdate(true)); }, []);
    const game = gid === 'example' ? example : gid ? Store.get(gid) : null;
    const open = (id) => { setGid(id); setView('game'); if (id !== 'example') lsSet('mjsb.last', id); };
    const commit = (g) => { if (g.example) setExample(g); else Store.save(g); };
    const signIn = () => setModal('signin');
    let body;
    if (!Store.authChecked) body = html`<div class="boot">Opening ${BRAND}…</div>`;
    else if (!Store.user) body = html`<${Welcome} onPick=${(m) => setModal(m === 'signin' ? 'signin' : m === 'create' ? 'create' : 'guest')} />`;
    else if (view === 'setup') body = html`<${Setup} onCancel=${() => setView(game ? 'game' : 'home')} onCreate=${(g) => { Store.save(g); open(g.id); }} />`;
    else if (view === 'game' && game) body = html`<${GameView} key=${game.id} game=${game} onBack=${() => { setView('home'); setGid(null); }} commit=${commit}
      onDelete=${() => { Store.remove(game.id); setView('home'); setGid(null); setToastMsg('Game deleted'); }} onNewGame=${() => setView('setup')} toast=${setToastMsg} onSignIn=${signIn} />`;
    else body = html`<${Home} example=${example} onNew=${() => setView('setup')} onOpen=${open} onSignIn=${signIn} onAccount=${() => setModal('account')} onToast=${setToastMsg} />`;
    return html`${body}
      ${modal === 'signin' || modal === 'create' || modal === 'guest' ? html`<${SignInSheet} initialMode=${modal} onClose=${() => setModal(null)} onDone=${(msg) => { setModal(null); setView('home'); setGid(null); setToastMsg(msg || ('Signed in as ' + displayName(Store.user))); }} />` : null}
      ${modal === 'account' ? html`<${AccountSheet} onClose=${() => setModal(null)} onToast=${setToastMsg} />` : null}
      ${update ? html`<div class="toast" role="status">A new version is ready<button type="button" onClick=${() => location.reload()}>Reload</button></div>` : toastMsg ? html`<div class="toast" role="status">${toastMsg}</div>` : null}`;
  }

  function start() {
    root.textContent = '';
    render(html`<${App} />`, root);
  }
  boot();
  start();
  if ('serviceWorker' in navigator && location.hostname !== '127.0.0.1' && !/^file:/.test(location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        reg.addEventListener('updatefound', () => {
          const w = reg.installing;
          if (!w) return;
          w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) window.dispatchEvent(new Event('mjsb-update')); });
        });
      }).catch(() => {});
    });
  }
})();
</script>
</body>
</html>
